<style>
/* Layout: navy ops header with a scrolling section strip, one working column (max 980px); every state is a colored chip, never a bare number */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#14212B; --muted:#56656F; --line:#D7DFE5;
  --head:#11283A; --head-ink:#E9F1F7; --head-muted:#9FB4C4;
  --accent:#B42318; --accent-ink:#FFFFFF; --accent-soft:#FBE8E6;
  --ok:#1C7347; --ok-soft:#E1F2E8; --warn:#9A5806; --warn-soft:#FCEFD8; --bad:#B42318; --bad-soft:#FBE6E3; --info:#1F5D8C; --info-soft:#E3EEF7;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161D; --surface:#15212B; --sunk:#111B23; --ink:#E4ECF2; --muted:#93A4B1; --line:#263643;
  --head:#0A1F2E; --head-ink:#E4EEF5; --head-muted:#8EA6B8;
  --accent:#F0685A; --accent-ink:#1A0A08; --accent-soft:#3A1915;
  --ok:#4CC587; --ok-soft:#14301F; --warn:#E9A949; --warn-soft:#352610; --bad:#F0685A; --bad-soft:#3A1915; --info:#6BB0E6; --info-soft:#132A3C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#15212B; --sunk:#111B23; --ink:#E4ECF2; --muted:#93A4B1; --line:#263643;
  --head:#0A1F2E; --head-ink:#E4EEF5; --head-muted:#8EA6B8;
  --accent:#F0685A; --accent-ink:#1A0A08; --accent-soft:#3A1915;
  --ok:#4CC587; --ok-soft:#14301F; --warn:#E9A949; --warn-soft:#352610; --bad:#F0685A; --bad-soft:#3A1915; --info:#6BB0E6; --info-soft:#132A3C;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.auth{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:16px}
.auth .logo{width:96px;height:96px;margin:0 auto;border-radius:18px;background:#fff;padding:6px;object-fit:contain}
.auth h1{text-align:center}
.link{background:none;border:0;color:var(--info);cursor:pointer;padding:4px;font-weight:600}
.out{background:none;border:1px solid var(--head-muted);color:var(--head-ink);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px;margin-top:4px}
.err{color:var(--bad);font-size:14px;margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;flex:none;max-width:none}
.brand b{font-size:18px;font-weight:700;display:block;line-height:1.2}
.brand small{color:var(--head-muted);font-size:12px;letter-spacing:.06em;display:block}
.who{text-align:left;font-size:13px;color:var(--head-muted);line-height:1.4}
.who strong{color:var(--head-ink);font-weight:600;display:block;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--head-muted);padding:8px 10px 9px;cursor:pointer;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-current="true"]{color:var(--head-ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--head-ink);outline-offset:-2px}
.badge{background:var(--accent);color:#fff;font-size:11px;font-family:var(--f-mono);border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
h2{font-size:17px;margin:0;font-weight:600}
.en{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:0}
.head-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--sunk)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap;line-height:24px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.neutral{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--info);outline-offset:1px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;font-weight:400}
textarea{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:118px}
.tile:hover{border-color:var(--muted)}
.tile b{font-size:17px}
.tile .meta{margin-top:auto}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td .tiny{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.prog{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.prog-in{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:160px;max-width:40vw}
.bar i{display:block;height:100%;background:var(--ok)}

.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid transparent}
.item:last-child{border-bottom:0}
.item.s-ok{border-inline-start-color:var(--ok)}
.item.s-warn{border-inline-start-color:var(--warn)}
.item.s-bad{border-inline-start-color:var(--bad)}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.iname{font-weight:600;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:40px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on.ok{background:var(--ok-soft);color:var(--ok)}
.seg button.on.warn{background:var(--warn-soft);color:var(--warn)}
.seg button.on.bad{background:var(--bad-soft);color:var(--bad)}
.seg button.on.info{background:var(--info-soft);color:var(--info)}
.detail{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
@media (max-width:560px){.detail{grid-template-columns:1fr}}
.photo-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo-in input{display:none}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--sunk)}
.meds-row{display:flex;flex-wrap:wrap;gap:12px 20px}
.mgrp{display:flex;flex-direction:column;gap:4px}
.seg button.num{min-width:44px}

.list{display:flex;flex-direction:column;gap:10px}
.rep{display:flex;gap:14px}
.rep .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ann{display:flex;flex-direction:column;gap:10px}
.ann p{margin:0;white-space:pre-wrap;max-width:65ch}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px}
.person img{width:22px;height:22px;border-radius:50%}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sched-img{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff}
a{color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const fileURL = {};
function getFileURL(id){
  if(!fileURL[id]) fileURL[id] = S.db.doc('files/'+id).get().then(sn => {
    const d = sn.data(); if(!d) throw new Error('missing');
    const [head, b64] = d.b64.split(','); const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], {type: d.type}));
  });
  return fileURL[id];
}
function hydrate(){
  document.querySelectorAll('[data-file]').forEach(el => {
    if(el.dataset.done) return; el.dataset.done = '1';
    getFileURL(el.dataset.file).then(u => { if(el.tagName==='IMG') el.src = u; else el.href = u; }).catch(() => { if(el.tagName==='IMG') el.alt = 'تعذّر تحميل الصورة'; });
  });
}
const readDataURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
async function compressImg(file){
  const bmp = await createImageBitmap(file);
  let max = 1600, q = 0.8, out = '';
  for(let k=0; k<6; k++){
    const sc = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if(out.length < 900000) return out;
    max = Math.round(max*0.8); q = Math.max(0.5, q-0.08);
  }
  throw {code:'too_large'};
}
async function uploadFile(file){
  let b64, type;
  if(/^image\//.test(file.type) || /\.(jpe?g|png|heic|webp)$/i.test(file.name)){ b64 = await compressImg(file); type = 'image/jpeg'; }
  else if(file.type==='application/pdf' || /\.pdf$/i.test(file.name)){ if(file.size > 680000) throw {code:'pdf_large'}; b64 = await readDataURL(file); type = 'application/pdf'; b64 = 'data:application/pdf;base64,' + b64.split(',')[1]; }
  else throw {code:'unsupported_type'};
  const ref = await S.db.collection('files').add({b64, type, name:file.name, by:S.uid, at:new Date().toISOString()});
  return {id:ref.id, contentType:type};
}
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };

function nm(id){ if(!id) return '—'; const u = S.users[id]; if(id===S.uid) return S.myName || (u && u.name) || 'أنت'; return (u && u.name) || 'موظف'; }
function ensureNames(){}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(S.tt); S.tt = setTimeout(()=>t.hidden = true, 3200); }
function failMsg(e){ console.error(e); toast(e && e.code==='resource-exhausted' ? 'تجاوزتم الحد اليومي المجاني. حاول غدًا أو احذف ملفات قديمة.' : e && e.code==='permission-denied' ? 'ليست لديك صلاحية لهذا الإجراء.' : e && e.code==='unavailable' ? 'لا يوجد اتصال بالإنترنت. أعد المحاولة.' : 'تعذّر الحفظ. أعد المحاولة.'); }
async function audit(action, detail){ try { await S.db.collection('audit').add({at:new Date().toISOString(), by:S.uid, action, detail: detail||''}); } catch(e){} }

/* ---------- data helpers ---------- */
const cfg = () => S.config || {};
const ambulances = () => cfg().ambulances || [];
function itemsFor(type){
  const c = cfg();
  if(type==='meds') return (c.meds||[]).map(m => ({name:m.name, qty:+m.qty||0}));
  const k = type==='vehicle' ? 'vehicleItems' : type;
  return (c[k]||[]).map(n => typeof n==='string' ? {name:n} : {name:n.name, qty:+n.qty||0});
}
function medStatus(qty, req, exp){
  if(exp==='expired') return 'expired';
  if(qty < req) return 'short';
  return 'ok';
}
const expLabel = e => e==='expired' ? 'منتهي' : e==='valid' ? 'سليم' : (e||'');
function latestInsp(amb, type, date){ return S.insp.find(i => i.ambulance===amb && i.type===type && (!date || i.date===date)); }
function myAcks(){ return S.acks[S.uid] || {}; }
function unreadAnns(){ if(!S.uid) return []; const a = myAcks(); return S.anns.filter(x => !a[x.id] && x.by !== S.uid); }
function openReports(){ return S.reports.filter(r => r.status !== 'resolved'); }
function newSchedule(){ const s = S.schedules[0]; return s && s.publishedAt > (lsGet('ems.seenSch')||''); }
function medAlerts(){
  const out = [];
  for(const a of ambulances()){
    const i = latestInsp(a,'meds');
    if(!i) continue;
    for(const it of i.items||[]) if(it.status!=='ok') out.push({amb:a, insp:i, it});
  }
  return out;
}
function bagAlerts(){
  const out = [];
  for(const a of ambulances()) for(const t of ['cpr','paramedic']){
    const i = latestInsp(a,t);
    if(!i) continue;
    for(const it of i.items||[]) if(it.status!=='ok') out.push({amb:a, type:t, insp:i, it});
  }
  return out;
}

/* ---------- render ---------- */
function navList(){
  const v = [['home','الرئيسية'],['schedule','المناوبات'],['announcements','التعليمات'],['vehicle','فحص السيارة'],['bags','فحص الشنط'],['reports','بلاغات الصيانة'],['swaps','تبديل النوبات'],['history','سجلي']];
  if(S.admin) v.push(['admin','الإدارة']);
  return v;
}
function renderTabs(){
  const badges = { announcements: unreadAnns().length, schedule: newSchedule() ? 1 : 0, reports: S.admin ? openReports().length : 0, swaps: swapsNeedingMe().length };
  document.getElementById('tabs').innerHTML = navList().map(([k,l]) =>
    `<button class="tab" data-act="go" data-v="${k}" aria-current="${S.view===k}">${l}${badges[k]?`<span class="badge">${badges[k]}</span>`:''}</button>`).join('');
}
function render(){
  const a = document.activeElement, fid = a && a.id;
  let ss=null, se=null; try { ss = a.selectionStart; se = a.selectionEnd; } catch(e){}
  S.seen = [];
  document.getElementById('whoName').textContent = S.uid ? (S.myName || 'مستخدم') + (S.admin ? ' · مسؤول' : ' · مسعف') : 'زائر';
  renderTabs();
  const V = {home:vHome, swaps:vSwaps, schedule:vSchedule, announcements:vAnns, vehicle:vVehicle, bags:vBags, reports:vReports, history:vHistory, admin:vAdmin};
  let html;
  document.getElementById('outBtn').hidden = !S.authUser;
  document.getElementById('tabs').hidden = !S.uid;
  if(S.noDb) html = `<div class="empty">${S.noDb===true ? 'لم تُضبط إعدادات Firebase في الملف بعد.' : esc(S.noDb)}</div>`;
  else if(S.gate) html = vGate();

  else if(!S.ready) html = `<div class="empty">جارٍ تحميل المنصة…</div>`;
  else html = (V[S.view]||vHome)();
  document.getElementById('view').innerHTML = html;
  if(fid){ const n = document.getElementById(fid); if(n && n !== document.activeElement){ n.focus({preventScroll:true}); try { if(ss!=null) n.setSelectionRange(ss,se); } catch(e){} } }
  hydrate();
}
function tick(){ const c = document.getElementById('clock'); if(c) c.textContent = new Date().toLocaleString(LOC,{weekday:'long',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }

function pageHead(ar, en, extra){ return `<div class="head-line"><div><div class="en">${en}</div><h1>${ar}</h1></div>${extra||''}</div>`; }
function noConfig(){ return S.admin ? `<div class="empty">لم تُضبط القوائم بعد. افتح <button class="btn sm" data-act="go" data-v="admin" data-tab="lists">الإدارة ← القوائم</button> وأضف السيارات والعناصر.</div>` : `<div class="empty">لم يجهّز المسؤول قوائم الفحص بعد.</div>`; }
function readOnlyNote(){ return false ? `<div class="banner warn"><span>حسابك للاطلاع فقط. اطلب من مسؤول القسم مشاركة المنصة معك بصلاحية <b>Contributor</b> حتى تسجّل الفحوصات.</span></div>` : ''; }

  const tile = (v, ar, en, meta) => `<button class="tile" data-act="go" data-v="${v}"><span class="en">${en}</span><b>${ar}</b><span class="meta">${meta}</span></button>`;
  const tiles = [
    tile('schedule','جدول المناوبات','Duty Schedule', sch ? `<span class="muted small">${esc(sch.month)}</span>` : chip('لا يوجد جدول','neutral')),
    tile('announcements','الإعلانات والتعليمات','Announcements', un.length ? chip(un.length+' غير مقروءة','warn') : chip('لا جديد','ok')),
    tile('vehicle','فحص سيارة الإسعاف','Ambulance Inspection', mine.some(i=>i.type==='vehicle') ? chip('تم اليوم','ok') : chip('لم تفحص اليوم','neutral')),
    tile('bags','فحص الشنط والمعدات','Medical Bags', chip(`${myBags} من 3 اليوم`, myBags===3?'ok':'neutral')),
    tile('reports','بلاغات الصيانة','Maintenance Reports', chip((S.admin ? open.length : open.filter(r=>r.by===S.uid).length)+' مفتوحة', open.length?'warn':'ok')),
    tile('swaps','تبديل النوبات','Shift Swap', swapsNeedingMe().length ? chip(swapsNeedingMe().length + (S.admin ? ' بانتظار اعتمادك' : ' بانتظار موافقتك'),'warn') : chip('لا طلبات معلقة','ok')),
    tile('history','بلاغاتي وفحوصاتي','My Reports', `<span class="muted small">${S.insp.filter(i=>i.by===S.uid).length} فحص مسجّل</span>`)
  ].join('');
  let extra = '';
  if(S.admin && S.config) extra = `<div class="stack"><div class="head-line"><h2>جاهزية اليوم</h2><button class="btn sm ghost" data-act="go" data-v="admin" data-tab="ready">التفاصيل</button></div>${readinessTable(t)}</div>`;
  return `<div class="stack">

function readinessTable(date){
  if(!ambulances().length) return noConfig();
  const types = ['vehicle','cpr','meds','paramedic'];
  const rows = ambulances().map(a => `<tr><td><b>${esc(a)}</b></td>${types.map(t => {
    const i = latestInsp(a,t,date);
    if(!i) return `<td>${chip('لم يُفحص','bad')}</td>`;
    return `<td>${i.status==='ready' ? chip('جاهز','ok') : chip(`يحتاج إجراء · ${i.issues}`,'warn')}<span class="tiny">${esc(nm(i.by))} · ${fmtT(i.at)}</span></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr><th>السيارة</th>${types.map(t=>`<th>${TYPES[t]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

      const unread = roster.filter(u => !readSet.has(u) && u!==a.by);
      const open = S.ui.openAnn===a.id;
      adminUI = `<div class="row"><span class="small">قرأها <b class="num">${readers.length}</b>${roster.length?` من <b class="num">${roster.filter(u=>u!==a.by).length}</b>`:''}</span>
        <button class="btn sm ghost" data-act="toggle" data-k="openAnn" data-id="${a.id}">${open?'إخفاء':'من قرأ ومن لم يقرأ'}</button>
        <button class="btn sm ghost danger" data-act="delAnn" data-id="${a.id}">${S.ui.confirm==='ann'+a.id?'تأكيد الحذف':'حذف'}</button></div>
        ${open ? `<div class="stack small"><div><b>قرأها:</b> <div class="people">${readers.map(r=>`<span class="person">${esc(nm(r.u))} · <span class="num">${fmtT(r.at)}</span></span>`).join('')||'<span class="muted">لا أحد بعد</span>'}</div></div>
          ${roster.length ? `<div><b>لم يقرأها:</b> <div class="people">${unread.map(u=>`<span class="person">${esc(nm(u))}</span>`).join('')||'<span class="muted">الجميع قرأها</span>'}</div></div>` : '<span class="muted">لا يوجد أعضاء بعد.</span>'}</div>` : ''}`;

  }).join('');
  return `<div class="stack">${pageHead('الإعلانات والتعليمات','EMS Announcements')}${compose}
    ${S.anns.length ? `<div class="list">${list}</div>` : '<div class="empty">لا توجد تعليمات منشورة.</div>'}</div>`;

/* ---------- inspections ---------- */
function newDraft(type){
  const h = new Date().getHours();
  return {type, ambulance: (S.draft && S.draft.ambulance) || lsGet('ems.amb') || ambulances()[0] || '', shift: h>=7 && h<19 ? 'morning' : 'evening', items:{}};
}
function draftEval(d){
  const list = itemsFor(d.type); let done=0, issues=0, soon=0;
  list.forEach((it,i) => {
    const x = d.items[i] || {};
    if(d.type==='meds'){
      if(x.qty!==undefined && x.qty!=='' && x.exp){ done++; const st = medStatus(+x.qty, it.qty, x.exp); if(st==='expired'||st==='short') issues++; if(st==='soon') soon++; }
    } else if(d.type==='vehicle'){
      if(x.status && (x.status==='good' || (x.note||'').trim())) done++;
      if(x.status && x.status!=='good') issues++;
    } else {
      if(x.status) done++;
      if(x.status && x.status!=='ok') issues++;
    }
  });
  return {total:list.length, done, issues, soon};
}
function photoCtl(key, photo){
  const up = S.ui.uploading[key];
  if(!S.assets) return '';
  return `<div class="photo-in">${photo ? `<a href="#" data-file="${photo}" target="_blank" rel="noopener"><img class="thumb" data-file="${photo}" alt="صورة مرفقة"></a>` : ''}
    ${up ? '<span class="muted small">جارٍ الرفع…</span>' : `<label class="btn sm" for="ph-${key}">${photo ? 'إعادة التصوير' : 'تصوير'}</label>
    <label class="btn sm" for="phg-${key}">من الاستديو</label>`}
    <input type="file" id="ph-${key}" accept="image/*" capture="environment" data-upload="${key}">
    <input type="file" id="phg-${key}" accept="image/*" data-upload="${key}"></div>`;
}
function inspHeader(d){
  return `<div class="card fields">
    <label class="f">الموظف<input type="text" id="hdrName" value="${esc(S.myName||'')}" disabled></label>
    <label class="f">السيارة<select id="hdrAmb" data-dh="ambulance">${ambulances().map(a=>`<option ${a===d.ambulance?'selected':''}>${esc(a)}</option>`).join('')}</select></label>
    <label class="f">الشفت<select id="hdrShift" data-dh="shift">${Object.entries(SHIFTS).map(([k,l])=>`<option value="${k}" ${k===d.shift?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">التاريخ والوقت<input type="text" id="hdrTime" value="${esc(new Date().toLocaleString(LOC,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}" disabled></label></div>`;
}
function itemRows(d){
  const list = itemsFor(d.type);
  if(d.type==='meds') return list.map((it,i) => {
    const x = d.items[i]||{}; const has = x.qty!==undefined && x.qty!=='' && x.exp;
    const st = has ? medStatus(+x.qty, it.qty, x.exp) : null;
    const cls = st ? 's-'+ST[st][1] : '';
    const max = Math.max(it.qty, 1);
    const nums = Array.from({length:max+1}, (_,n) => `<button class="num ${String(x.qty)===String(n)?'on '+(n<it.qty?'bad':'ok'):''}" data-act="setMed" data-i="${i}" data-k="qty" data-v="${n}" aria-pressed="${String(x.qty)===String(n)}">${n}</button>`).join('');
    const exp = [['valid','سليم','ok'],['expired','منتهي','bad']].map(([v,l,c]) => `<button class="${x.exp===v?'on '+c:''}" data-act="setMed" data-i="${i}" data-k="exp" data-v="${v}" aria-pressed="${x.exp===v}">${l}</button>`).join('');
    return `<div class="item ${cls}"><div class="item-h"><span class="iname">${esc(it.name)}<span class="muted small" style="display:block;font-weight:400">المطلوب: <span class="num">${it.qty}</span></span></span>${st ? chip(ST[st][0], ST[st][1]) : chip('لم يُفحص','neutral')}</div>
      <div class="meds-row"><div class="mgrp"><span class="muted small">الكمية الموجودة</span><div class="seg" role="group" aria-label="الكمية">${nums}</div></div>
      <div class="mgrp"><span class="muted small">الصلاحية</span><div class="seg" role="group" aria-label="الصلاحية">${exp}</div></div></div></div>`;
  }).join('');
  const opts = d.type==='vehicle' ? ['good','attention','defect'] : ['ok','missing','damaged'];
  return list.map((it,i) => {
    const x = d.items[i]||{};
    const cls = x.status ? 's-'+ST[x.status][1] : '';
    const seg = opts.map(o => `<button data-act="set" data-i="${i}" data-v="${o}" class="${x.status===o?'on '+ST[o][1]:''}" aria-pressed="${x.status===o}">${ST[o][0]}</button>`).join('');
    let det = '';
    if(x.status && x.status!=='good' && x.status!=='ok'){
      det = `<div class="detail"><div class="stack" style="gap:8px">
        <textarea id="d-${i}-note" data-d="${i}" data-k="note" placeholder="${d.type==='vehicle'?'وصف المشكلة (مطلوب)':'ملاحظة (اختياري)'}">${esc(x.note||'')}</textarea>
        ${d.type==='vehicle' ? `<label class="f small">الأولوية<select id="d-${i}-pri" data-d="${i}" data-k="pri">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${(x.pri||'medium')===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>` : ''}
        </div>${photoCtl('i'+i, x.photo)}</div>`;
    }

function progressBar(d){
  const ev = draftEval(d); const pct = ev.total ? Math.round(ev.done/ev.total*100) : 0;
  const statusChip = ev.done<ev.total ? chip('غير مكتمل','neutral') : ev.issues ? chip(`يحتاج إجراء · ${ev.issues}`,'warn') : chip('جاهز','ok');
  return `<div class="prog" id="prog"><div class="prog-in"><div class="row"><span class="bar"><i style="width:${pct}%"></i></span>
    <span class="small">العناصر المفحوصة <b class="num">${ev.done}/${ev.total}</b>${ev.issues?` · النواقص <b class="num">${ev.issues}</b>`:''}</span>${statusChip}</div>
    <button class="btn primary" data-act="submitInsp" ${ev.done<ev.total||!ev.total||!S.uid?'disabled':''}>اعتماد الفحص</button></div></div>`;
}

/* ---------- shift swaps ---------- */
function swapsNeedingMe(){
  if(!S.uid) return [];
  return S.swaps.filter(w => S.admin ? w.status==='pending_admin' : (w.status==='pending_partner' && w.partner===S.uid));
}
function fileLink(f, label){
  if(!f || !f.id) return '';
  return /^image\//.test(f.type||'') ? `<a href="#" data-file="${f.id}" target="_blank" rel="noopener"><img class="thumb" data-file="${f.id}" alt="${esc(label)}"></a>`
    : `<a class="btn sm" href="#" data-file="${f.id}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
function fileCtl(key, f){
  const up = S.ui.uploading[key];
  return `<div class="photo-in">${f ? fileLink(f, f.name || 'الملف المرفق') : ''}
    ${up ? '<span class="muted small">جارٍ الرفع…</span>' : `<label class="btn sm" for="fc-${key}">تصوير</label>

}
function swapCard(w){

/* ---------- Excel export ---------- */
async function runExport(b, from, to, fname, full){
  if(!window.XLSX){ toast('تعذّر تحميل أداة Excel. تأكد من الإنترنت ثم أعد تحميل الصفحة.'); return; }
  const label = b.textContent; b.disabled = true; b.textContent = 'جارٍ تجهيز الملف…';
  try {
    const db = S.db;
    const D = iso => iso ? new Date(iso).toLocaleDateString('en-CA') : '';
    const T = iso => iso ? new Date(iso).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
    const stl = k => (ST[k] ? ST[k][0] : (k || ''));
    const byRange = async (col, field, lo, hi) => { const q = await db.collection(col).where(field,'>=',lo).where(field,'<=',hi).get();
      return q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => (x[field]||'') < (y[field]||'') ? -1 : 1); };
    const hi = to + '~';
    const ins = await byRange('inspections', 'date', from, to);
    const reps = await byRange('reports', 'at', from, hi);
    const anns = await byRange('announcements', 'at', from, hi);
    const auds = await byRange('audit', 'at', from, hi);
    let swaps = [];
    try { swaps = await byRange('swaps', 'at', from, hi); } catch(e){}
    const scheds = full ? await byRange('schedules', 'publishedAt', from, hi) : [];

    const summary = ins.map(i => ({'التاريخ': i.date, 'الوقت': T(i.at), 'السيارة': i.ambulance, 'نوع الفحص': TYPES[i.type] || i.type,
      'الشفت': SHIFTS[i.shift] || '', 'الموظف': nm(i.by), 'عدد العناصر': i.total, 'النواقص والأعطال': i.issues,
      'الحالة': i.status === 'ready' ? 'جاهز' : 'يحتاج إجراء'}));
    const detail = [];
    ins.forEach(i => (i.items || []).forEach(x => detail.push({'التاريخ': i.date, 'الوقت': T(i.at), 'السيارة': i.ambulance,
      'نوع الفحص': TYPES[i.type] || i.type, 'الموظف': nm(i.by), 'العنصر': x.name, 'الحالة': stl(x.status),
      'المطلوب': x.req ?? '', 'الموجود': x.qty ?? '', 'الصلاحية': x.exp ? expLabel(x.exp) : '',
      'الأولوية': x.priority ? PRI[x.priority][0] : '', 'ملاحظة': x.note || '', 'صورة مرفقة': x.photo ? 'نعم' : ''})));
    const reports = reps.map(r => { const last = (r.history || []).slice(-1)[0];
      return {'تاريخ البلاغ': D(r.at), 'الوقت': T(r.at), 'السيارة': r.ambulance, 'العنصر': r.item, 'الوصف': r.desc || '',
        'الأولوية': PRI[r.priority || 'medium'][0], 'الحالة': RST[r.status][0], 'المُبلّغ': nm(r.by),
        'المصدر': r.source === 'inspection' ? 'من فحص السيارة' : 'بلاغ يدوي',
        'آخر تحديث': last ? `${D(last.at)} ${T(last.at)}` : '', 'حدّثه': last ? nm(last.by) : '', 'صورة مرفقة': r.photo ? 'نعم' : ''}; });
    const members = Object.entries(S.users).filter(([id,u]) => u.active !== false).map(([id]) => id);
    const annRows = anns.map(a => { const readers = members.filter(u => S.acks[u] && S.acks[u][a.id]);
      const unread = members.filter(u => u !== a.by && !(S.acks[u] && S.acks[u][a.id]));
      return {'التاريخ': D(a.at), 'التعليمة': a.body, 'الناشر': nm(a.by), 'عدد من قرأ': readers.length,
        'قرأها': readers.map(nm).join('، '), 'لم يقرأها': unread.map(nm).join('، ')}; });
    const swapRows = swaps.map(w => ({'تاريخ الطلب': D(w.at), 'الوقت': T(w.at), 'الموظف الأول': nm(w.by), 'نوبته': `${w.myDate} ${SHIFTS[w.myShift]||''}`,
      'الموظف الثاني': nm(w.partner), 'نوبته ': `${w.partnerDate} ${SHIFTS[w.partnerShift]||''}`, 'السبب': w.reason || '',
      'الحالة': (SW[w.status]||[w.status])[0], 'ملاحظة المسؤول': w.adminNote || '', 'نموذج مرفق': w.form ? 'نعم' : ''}));
    const team = Object.entries(S.users).map(([id,u]) => { const mine = ins.filter(i => i.by === id);
      return {'الاسم': u.name || '', 'الإيميل': u.email || '', 'الصلاحية': u.role === 'admin' ? 'مسؤول' : 'مسعف',
        'الحالة': u.active === false ? 'موقوف' : 'فعّال', 'تاريخ الانضمام': D(u.at), 'فحوصات الفترة': mine.length,
        'آخر فحص في الفترة': mine.length ? `${mine[mine.length-1].date} ${T(mine[mine.length-1].at)}` : ''}; });
    const audRows = auds.map(a => ({'التاريخ': D(a.at), 'الوقت': T(a.at), 'الموظف': nm(a.by), 'الإجراء': a.action, 'التفاصيل': a.detail || ''}));
    const schedRows = scheds.map(x => ({'الشهر': x.month, 'تاريخ النشر': D(x.publishedAt), 'الناشر': nm(x.by), 'الملاحظات': x.note || '', 'اسم الملف': x.fileName || ''}));
    const c = cfg(), listRows = [];
    (c.ambulances||[]).forEach(n => listRows.push({'القائمة': 'السيارات', 'العنصر': n, 'الكمية المطلوبة': ''}));
    (c.vehicleItems||[]).forEach(n => listRows.push({'القائمة': 'فحص السيارة', 'العنصر': n, 'الكمية المطلوبة': ''}));
    [['cpr','شنطة CPR'],['paramedic','شنطة المسعف'],['meds','شنطة الأدوية']].forEach(([k,l]) => (c[k]||[]).forEach(n => listRows.push({'القائمة': l, 'العنصر': typeof n==='string' ? n : n.name, 'الكمية المطلوبة': typeof n==='string' ? '' : n.qty})));

    const wb = XLSX.utils.book_new();
    wb.Workbook = {Views: [{RTL: true}]};
    const add = (rows, name, empty) => {
      const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([[empty]]);
      if(rows.length){ const keys = Object.keys(rows[0]);
        ws['!cols'] = keys.map(k => ({wch: Math.min(60, Math.max(k.length, ...rows.map(r => String(r[k] ?? '').length)) + 2)}));
        ws['!autofilter'] = {ref: ws['!ref']}; }
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    add(summary, 'ملخص الفحوصات', 'لا توجد فحوصات في هذه الفترة');
    add(detail, 'تفاصيل الفحوصات', 'لا توجد فحوصات في هذه الفترة');
    add(reports, 'بلاغات الصيانة', 'لا توجد بلاغات في هذه الفترة');
    add(swapRows, 'تبديل النوبات', 'لا توجد طلبات تبديل في هذه الفترة');
    add(annRows, 'التعليمات', 'لا توجد تعليمات في هذه الفترة');
    if(full) add(schedRows, 'جداول المناوبات', 'لا توجد جداول في هذه الفترة');
    add(team, 'الفريق', 'لا يوجد أعضاء');
    if(full) add(listRows, 'قوائم الفحص', 'لا توجد قوائم');
    add(audRows, 'سجل التدقيق', 'لا توجد إجراءات في هذه الفترة');
    XLSX.writeFile(wb, fname);
    audit('تصدير Excel', fname);
    toast(`تم تجهيز الملف: ${ins.length} فحص، ${reps.length} بلاغ، ${swaps.length} طلب تبديل`);
  } catch(e){ console.error(e); toast('تعذّر تجهيز الملف. أعد المحاولة.'); }
  b.disabled = false; b.textContent = label;
}
function archiveMonths(){
  const starts = Object.values(S.users).map(u => u.at).filter(Boolean).sort();
  const first = starts[0] ? new Date(starts[0]) : new Date();
  const out = [], d = new Date(first.getFullYear(), first.getMonth(), 1), now = new Date();
  while(d <= now && out.length < 120){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); d.setMonth(d.getMonth()+1); }
  return out.reverse();
}

/* ---------- statistics ---------- */
function statRange(per){
  const d = new Date(), iso = x => x.toLocaleDateString('en-CA');
  if(per === 'week'){ const w = new Date(); w.setDate(w.getDate() - 6); return {from: iso(w), to: iso(d)}; }
  if(per === 'prev'){ const a = new Date(d.getFullYear(), d.getMonth() - 1, 1), z = new Date(d.getFullYear(), d.getMonth(), 0); return {from: iso(a), to: iso(z)}; }
  if(per === 'all') return {from: '0000-00-00', to: '9999-12-31'};
  return {from: iso(d).slice(0,8) + '01', to: iso(d)};
}
async function loadStats(key, rng){
  S.statsLoading = key;
  try {
    const q1 = await S.db.collection('inspections').where('date','>=',rng.from).where('date','<=',rng.to).get();
    const q2 = await S.db.collection('reports').where('at','>=',rng.from).where('at','<=',rng.to + '~').get();
    S.stats = {key, ins: q1.docs.map(d => d.data()), reps: q2.docs.map(d => d.data())};
  } catch(e){ console.error(e); toast('تعذّر تحميل الإحصائيات. أعد المحاولة.'); }
  S.statsLoading = null; render();
}

    <div class="row"><button class="btn primary" data-act="retryGate">إعادة المحاولة</button><button class="btn ghost" data-act="logout">خروج</button></div></div></div>`;
  if(g==='inactive') return `<div class="auth">${logo}<h1>تم إيقاف حسابك</h1><div class="card stack"><p style="margin:0">تواصل مع مسؤول القسم.</p><button class="btn ghost" data-act="logout">خروج</button></div></div>`;
  const title = m==='register' ? 'حساب جديد' : m==='reset' ? 'استعادة كلمة المرور' : 'تسجيل الدخول';
  return `<div class="auth">${logo}<div style="text-align:center"><div class="en">AL HAYAT EMS</div><h1>${title}</h1></div>

      ${m==='register' ? `<label class="f">الاسم الكامل<input type="text" id="aName" autocomplete="name" required></label>` : ''}
      <label class="f">البريد الإلكتروني<input type="text" id="aEmail" inputmode="email" autocomplete="username" dir="ltr" autocapitalize="none" required></label>
      ${m!=='reset' ? `<label class="f">كلمة المرور<input type="password" id="aPass" autocomplete="${m==='register'?'new-password':'current-password'}" dir="ltr" required></label>` : ''}
      ${S.authErr ? `<p class="err">${esc(S.authErr)}</p>` : ''}
      <button class="btn primary" type="submit" ${busy}>${m==='register' ? 'إنشاء الحساب' : m==='reset' ? 'إرسال رابط الاستعادة' : 'دخول'}</button>
    </form>
    <div class="row" style="justify-content:center">
      ${m!=='login' ? `<button class="link" data-act="authMode" data-v="login">لدي حساب: تسجيل الدخول</button>` : `<button class="link" data-act="authMode" data-v="register">أول مرة؟ أنشئ حسابك</button><button class="link" data-act="authMode" data-v="reset">نسيت كلمة المرور</button>`}
    </div>
    ${m==='register' ? `<p class="sub" style="text-align:center">استخدم نفس الإيميل الذي أضافه مسؤول القسم.</p>` : ''}</div>`;
}
const AUTH_ERR = {'auth/invalid-email':'صيغة البريد غير صحيحة.','auth/missing-password':'اكتب كلمة المرور.','auth/weak-password':'كلمة المرور قصيرة: 6 أحرف على الأقل.',
  'auth/email-already-in-use':'هذا البريد لديه حساب. استخدم تسجيل الدخول.','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة.',
  'auth/user-not-found':'لا يوجد حساب بهذا البريد. أنشئ حسابًا جديدًا.','auth/too-many-requests':'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.','auth/network-request-failed':'لا يوجد اتصال بالإنترنت.'};
document.addEventListener('submit', async e => {
  if(e.target.id !== 'authForm') return; e.preventDefault();
  const v = id => (document.getElementById(id)||{}).value || '';
  const email = v('aEmail').trim().toLowerCase(), pass = v('aPass'), name = v('aName').trim();
  S.authErr = '';
  if(S.authMode==='register' && !name){ S.authErr = 'اكتب اسمك الكامل.'; render(); return; }
  S.authBusy = true; render();
  try {
    const auth = firebase.auth();
    if(S.authMode==='login') await auth.signInWithEmailAndPassword(email, pass);
    else if(S.authMode==='register'){ S.pendingName = name; await auth.createUserWithEmailAndPassword(email, pass); }
    else { await auth.sendPasswordResetEmail(email); S.authMode = 'login'; toast('أرسلنا رابط استعادة كلمة المرور إلى بريدك'); }
  } catch(err){ console.error(err); S.authErr = AUTH_ERR[err.code] || 'تعذّر الإجراء. أعد المحاولة.'; }
  S.authBusy = false; render();
});
async function enterApp(u){
  const db = S.db;
  S.gate = 'loading'; render();
  try {
    let me = await db.doc('users/'+u.uid).get();
    if(!me.exists){
      const name = S.pendingName || u.email.split('@')[0];
      const owner = await db.doc('meta/owner').get();
      if(!owner.exists){
        const b = db.batch();
        b.set(db.doc('meta/owner'), {uid:u.uid, at:new Date().toISOString()});
        b.set(db.doc('users/'+u.uid), {name, role:'admin', email:u.email, active:true, at:new Date().toISOString()});
        await b.commit();
        const c = await db.doc('config/main').get();
        if(!c.exists) await db.doc('config/main').set(Object.assign({}, DEFAULT_CONFIG, {updatedAt:new Date().toISOString(), updatedBy:u.uid}));
      } else {
        try { await db.doc('users/'+u.uid).set({name, role:'paramedic', email:u.email, active:true, at:new Date().toISOString()}); }
        catch(e){ S.gate = 'denied'; render(); return; }
      }
      me = await db.doc('users/'+u.uid).get();
    }
    const d = me.data();
    if(d.active === false){ S.gate = 'inactive'; render(); return; }
    S.uid = u.uid; S.myName = d.name; S.admin = d.role==='admin'; S.gate = null;
    startData();
  } catch(e){ console.error(e); S.noDb = 'تعذّر الاتصال بقاعدة البيانات. تأكد من الإنترنت ومن نشر قواعد الأمان (Rules) ثم أعد تحميل الصفحة.'; render(); }
}

  } catch(err){
    console.error(err);
    toast(err && err.code==='pdf_large' ? 'ملف PDF كبير. صدّر الجدول كصورة (لقطة شاشة) وارفعها بدلًا منه.' : err && err.code==='too_large' ? 'الصورة كبيرة جدًا. جرّب صورة أخرى.' : err && err.code==='unsupported_type' ? 'نوع الملف غير مدعوم. استخدم PDF أو صورة JPG/PNG.' : 'تعذّر رفع الملف. حاول مرة أخرى.');
  }
  S.ui.uploading[key] = false; t.value = ''; render();
});
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b || file;
  } catch(e){ return file; }
}

/* ---------- boot ---------- */
function startData(){
  const db = S.db;
  const h = (location.hash||'').slice(1); if(navList().some(([k]) => k===h)) S.view = h;
  const err = e => { console.error(e); if(e.code==='permission-denied'){ S.noDb = 'انتهت صلاحية دخولك أو تم إيقاف حسابك. أعد تحميل الصفحة.'; render(); } };
  const list = (path, field, n, key) => db.collection(path).orderBy(field,'desc').limit(n).onSnapshot(q => { S[key] = q.docs.map(d => Object.assign({id:d.id}, d.data())); render(); }, err);
  db.doc('config/main').onSnapshot(s => { S.config = s.exists ? s.data() : null; S.configLoaded = true; S.ready = true; if(S.ui.adminTab!=='lists') S.ui.cfgInit = false; render(); }, err);
  db.collection('users').onSnapshot(q => { const u = {}; q.docs.forEach(d => u[d.id] = d.data()); S.users = u;
    const me = u[S.uid]; if(me){ S.myName = me.name; const wasAdmin = S.admin; S.admin = me.role==='admin'; if(me.active===false){ location.reload(); return; } if(S.admin && !wasAdmin) location.reload(); }
    render(); }, err);
  list('schedules','publishedAt',12,'schedules');
  list('announcements','at',30,'anns');
  list('inspections','at',150,'insp');
  list('reports','at',120,'reports');
  list('swaps','at',150,'swaps');
  if(S.admin){ list('audit','at',100,'audit'); db.collection('allowed').onSnapshot(q => { S.allowed = q.docs.map(d => d.id); render(); }, err); }
  db.collection('acks').onSnapshot(q => { const a = {}; q.docs.forEach(d => a[d.id] = d.data()); S.acks = a; render(); }, err);
}
function init(){
  tick(); setInterval(tick, 30000);
  if(!window.firebase || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==='PASTE_HERE'){ S.noDb = window.firebase ? true : 'تعذّر تحميل مكتبات Firebase. تأكد من الاتصال بالإنترنت.'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.db = firebase.firestore();
  try { S.db.enablePersistence({synchronizeTabs:true}).catch(() => {}); } catch(e){}
  S.gate = 'loading'; render();
  firebase.auth().onAuthStateChanged(u => {
    S.authUser = u;
    if(!u){ S.uid = null; S.gate = 'login'; render(); return; }
    enterApp(u);
  });
}
init();
</script>
