<style>
/* Layout: navy ops header with a scrolling section strip, one working column (max 980px); every state is a colored chip, never a bare number */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#14212B; --muted:#56656F; --line:#D7DFE5;
  --head:#11283A; --head-ink:#E9F1F7; --head-muted:#9FB4C4;
  --accent:#B42318; --accent-ink:#FFFFFF; --accent-soft:#FBE8E6;
  --ok:#1C7347; --ok-soft:#E1F2E8; --warn:#9A5806; --warn-soft:#FCEFD8; --bad:#B42318; --bad-soft:#FBE6E3; --info:#1F5D8C; --info-soft:#E3EEF7;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  --oud:#7A1F2B; --oud-soft:#F6E4E6; --oud-ink:#7A1F2B; --oud-glow:rgba(122,31,43,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161D; --surface:#15212B; --sunk:#111B23; --ink:#E4ECF2; --muted:#93A4B1; --line:#263643;
  --head:#0A1F2E; --head-ink:#E4EEF5; --head-muted:#8EA6B8;
  --accent:#F0685A; --accent-ink:#1A0A08; --accent-soft:#3A1915;
  --ok:#4CC587; --ok-soft:#14301F; --warn:#E9A949; --warn-soft:#352610; --bad:#F0685A; --bad-soft:#3A1915; --info:#6BB0E6; --info-soft:#132A3C;
  --oud:#9E2A3A; --oud-soft:#3A1A20; --oud-ink:#F0A3AD; --oud-glow:rgba(158,42,58,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#15212B; --sunk:#111B23; --ink:#E4ECF2; --muted:#93A4B1; --line:#263643;
  --head:#0A1F2E; --head-ink:#E4EEF5; --head-muted:#8EA6B8;
  --accent:#F0685A; --accent-ink:#1A0A08; --accent-soft:#3A1915;
  --ok:#4CC587; --ok-soft:#14301F; --warn:#E9A949; --warn-soft:#352610; --bad:#F0685A; --bad-soft:#3A1915; --info:#6BB0E6; --info-soft:#132A3C;
  --oud:#9E2A3A; --oud-soft:#3A1A20; --oud-ink:#F0A3AD; --oud-glow:rgba(158,42,58,.45);
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.auth{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:16px}
.auth .logo{width:96px;height:96px;margin:0 auto;border-radius:18px;background:#fff;padding:6px;object-fit:contain}
.auth h1{text-align:center}
.link{background:none;border:0;color:var(--info);cursor:pointer;padding:4px;font-weight:600}
.out{background:none;border:1px solid var(--head-muted);color:var(--head-ink);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px;margin-top:4px}
.err{color:var(--bad);font-size:14px;margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;flex:none;max-width:none}
.brand b{font-size:18px;font-weight:700;display:block;line-height:1.2}
.brand small{color:var(--head-muted);font-size:12px;letter-spacing:.06em;display:block}
.who{text-align:left;font-size:13px;color:var(--head-muted);line-height:1.4}
.who strong{color:var(--head-ink);font-weight:600;display:block;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--head-muted);padding:8px 10px 9px;cursor:pointer;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-current="true"]{color:var(--head-ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--head-ink);outline-offset:-2px}
.badge{background:var(--accent);color:#fff;font-size:11px;font-family:var(--f-mono);border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
h2{font-size:17px;margin:0;font-weight:600}
.en{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:0}
.head-line{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:var(--sunk)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap;line-height:24px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.neutral{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--info);outline-offset:1px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;font-weight:400}
textarea{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:118px}
.tile:hover{border-color:var(--muted)}
.tile b{font-size:17px}
.tile .meta{margin-top:auto}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:12px 16px;background:var(--info-soft);color:var(--ink);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td .tiny{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.prog{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.prog-in{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:160px;max-width:40vw}
.bar i{display:block;height:100%;background:var(--ok)}
.grid-r td.k-tb{background:var(--ok-soft);color:var(--ok);font-weight:700}.grid-r td.chg{box-shadow:inset 0 0 0 2px var(--warn)}
.bar.full{width:100%;max-width:none;height:8px}
.pdfv{display:flex;flex-direction:column;gap:10px}.pdfv img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sigpad{width:100%;height:200px;border:2px dashed var(--muted);border-radius:10px;background:var(--surface);touch-action:none;cursor:crosshair;display:block}
button.card{font:inherit;color:inherit;width:100%}

.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid transparent}
.item:last-child{border-bottom:0}
.item.s-ok{border-inline-start-color:var(--ok)}
.item.s-warn{border-inline-start-color:var(--warn)}
.item.s-bad{border-inline-start-color:var(--bad)}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.iname{font-weight:600;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:40px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on.ok{background:var(--ok-soft);color:var(--ok)}
.seg button.on.warn{background:var(--warn-soft);color:var(--warn)}
.seg button.on.bad{background:var(--bad-soft);color:var(--bad)}
.seg button.on.info{background:var(--info-soft);color:var(--info)}
.detail{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
@media (max-width:560px){.detail{grid-template-columns:1fr}}
.photo-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo-in input{display:none}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--sunk)}
.meds-row{display:flex;flex-wrap:wrap;gap:12px 20px}
.mgrp{display:flex;flex-direction:column;gap:4px}
.seg button.num{min-width:44px}

.list{display:flex;flex-direction:column;gap:10px}
.rep{display:flex;gap:14px}
.rep .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ann{display:flex;flex-direction:column;gap:10px}
.ann p{margin:0;white-space:pre-wrap;max-width:65ch}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px}
.person img{width:22px;height:22px;border-radius:50%}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--oud);color:#fff;border-color:var(--oud);box-shadow:0 2px 6px var(--oud-glow)}
.seg button[aria-pressed="true"]:not(.on){background:var(--oud);color:#fff}
.seg button.on{box-shadow:inset 0 -3px 0 var(--oud)}
.seg button:active,.subtabs button:active{background:var(--oud-soft);color:var(--oud-ink)}
.btn:active{transform:scale(.97);border-color:var(--oud);background:var(--oud-soft)}
.btn.primary:active{background:var(--oud);border-color:var(--oud);color:#fff}
.tile:active{border-color:var(--oud);background:var(--oud-soft)}
.tile:hover{border-color:var(--oud)}
button.card:active,tr[data-act]:active td{background:var(--oud-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--oud);width:18px;height:18px}
input:focus,select:focus,textarea:focus{border-color:var(--oud)}
.head-line .en{color:var(--oud-ink)}
.head-line h1{border-inline-start:4px solid var(--oud);padding-inline-start:10px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sched-img{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff}
a{color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
[dir=ltr] th,[dir=ltr] td,[dir=ltr] .tile{text-align:left}
[dir=ltr] .who{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button.dc{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.cal button.dc b{font-family:var(--f-mono);font-size:13px}
.cal button.dc.p-m{background:var(--info-soft);border-color:var(--info)}
.cal button.dc.p-e{background:var(--warn-soft);border-color:var(--warn)}
.cal button.dc.p-any{background:var(--ok-soft);border-color:var(--ok)}
.cal button.dc.p-off{background:var(--sunk);border-style:dashed}
.cal button.dc.p-na{background:var(--bad-soft);border-color:var(--bad)}
.cal .ot{font-size:10px;color:var(--ok);font-weight:700}
.grid-r{border-collapse:collapse;min-width:0;width:auto}
.grid-r th,.grid-r td{padding:3px 4px;font-size:11px;text-align:center;border:1px solid var(--line);white-space:nowrap}
.grid-r td.nm{text-align:start;font-weight:600;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.grid-r td.c{cursor:pointer;min-width:30px;font-family:var(--f-mono)}
.grid-r td.k-m{background:var(--info-soft)} .grid-r td.k-e{background:var(--warn-soft)}
.grid-r td.lk{outline:2px solid var(--ink);outline-offset:-2px}
.grid-r td.vi{box-shadow:inset 0 0 0 2px var(--bad)}
.grid-r td.um::after{content:"•";color:var(--bad);font-size:10px;vertical-align:super}
.grid-r td.sel{outline:3px solid var(--accent);outline-offset:-3px}
.grid-r tr.sh td{color:var(--bad);font-weight:700}
.p-m{background:var(--info-soft)} .p-e{background:var(--warn-soft)} .p-any{background:var(--ok-soft)} .p-na{background:var(--bad-soft)} .p-off{background:var(--sunk)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const I18N_RE = (() => { const ks = Object.keys(I18N).sort((a,b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('(^|[^\\u0600-\\u06FF])(' + ks.join('|') + ')(?![\\u0600-\\u06FF])', 'g'); })();
function tr(str){
  if(LANG !== 'en' || str == null || typeof str !== 'string' || !/[؀-ۿ]/.test(str)) return str;
  let out = str.replace(I18N_RE, (m, p, k) => p + I18N[k]).replace(I18N_RE, (m, p, k) => p + I18N[k]);
  return out.replace(/\.\.(?!\.)/g, '.').replace(/،/g, ',').replace(/؟/g, '?').replace(/[←→]/g, c => c === '←' ? '→' : '←');
}

  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
    const p = n.parentElement; if(!p || p.closest('[translate="no"],textarea,script,style')) return NodeFilter.FILTER_REJECT;
    return /[؀-ۿ]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; } });
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const t = n.nodeValue.trim(); if(names.has(t)) return; const v = tr(n.nodeValue); if(v !== n.nodeValue) n.nodeValue = v; });

}

function getFileURL(id){
  if(!fileURL[id]) fileURL[id] = S.db.doc(id.startsWith('rec:') ? 'recfiles/'+id.slice(4) : id.startsWith('rosc:') ? 'roscfiles/'+id.slice(5) : 'files/'+id).get().then(sn => {
    const d = sn.data(); if(!d) throw new Error('missing');
    const [head, b64] = d.b64.split(','); const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);

async function compressImg(file){
  const bmp = await createImageBitmap(file);
  let max = 1600, q = 0.8, out = '';
  for(let k=0; k<6; k++){
    const sc = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);

    max = Math.round(max*0.8); q = Math.max(0.5, q-0.08);

}

/* ---------- inspections ---------- */
function newDraft(type){
  const h = new Date().getHours();
  const keep = S.draft && S.draft.ambulance && units(type).includes(S.draft.ambulance) ? S.draft.ambulance : '';
  const saved = lsGet(type==='golf' ? 'ems.golf' : 'ems.amb');
  return {type, ambulance: keep || (units(type).includes(saved) ? saved : '') || units(type)[0] || '', shift: h>=7 && h<19 ? 'morning' : 'evening', items:{}};
}
function draftEval(d){
  const list = itemsFor(d.type); let done=0, issues=0, soon=0;
  list.forEach((it,i) => {
    const x = d.items[i] || {};
    if(d.type==='meds'){
      if(x.qty!==undefined && x.qty!=='' && x.exp){ done++; const st = medStatus(+x.qty, it.qty, x.exp); if(st==='expired'||st==='short') issues++; if(st==='soon') soon++; }
    } else if(d.type==='vehicle'){
      if(x.status && (x.status==='good' || (x.note||'').trim())) done++;
      if(x.status && x.status!=='good') issues++;
    } else {
      if(x.status) done++;
      if(x.status && x.status!=='ok' && x.status!=='good') issues++;
    }
  });
  return {total:list.length, done, issues, soon};
}
function photoCtl(key, photo){
  const up = S.ui.uploading[key];
  if(!S.assets) return '';
  return `<div class="photo-in">${photo ? `<a href="#" data-file="${photo}" target="_blank" rel="noopener"><img class="thumb" data-file="${photo}" alt="صورة مرفقة"></a>` : ''}
    ${up ? '<span class="muted small">جارٍ الرفع…</span>' : `<label class="btn sm" for="ph-${key}">${photo ? 'إعادة التصوير' : 'تصوير'}</label>
    <label class="btn sm" for="phg-${key}">من الاستديو</label>`}
    <input type="file" id="ph-${key}" accept="image/*" capture="environment" data-upload="${key}">
    <input type="file" id="phg-${key}" accept="image/*" data-upload="${key}"></div>`;
}
function inspHeader(d){
  return `<div class="card fields">
    <label class="f">الموظف<input type="text" id="hdrName" value="${esc(S.myName||'')}" disabled></label>
    <label class="f">${d.type==='golf'?'عربة القولف':'السيارة'}<select id="hdrAmb" data-dh="ambulance">${units(d.type).map(a=>`<option ${a===d.ambulance?'selected':''}>${esc(a)}</option>`).join('')}</select></label>
    <label class="f">الشفت<select id="hdrShift" data-dh="shift">${Object.entries(SHIFTS).map(([k,l])=>`<option value="${k}" ${k===d.shift?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">التاريخ والوقت<input type="text" id="hdrTime" value="${esc(new Date().toLocaleString(LOC,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}" disabled></label></div>`;
}
function itemRows(d){
  const list = itemsFor(d.type);
  if(d.type==='meds') return list.map((it,i) => {
    const x = d.items[i]||{}; const has = x.qty!==undefined && x.qty!=='' && x.exp;
    const st = has ? medStatus(+x.qty, it.qty, x.exp) : null;
    const cls = st ? 's-'+ST[st][1] : '';
    const max = Math.max(it.qty, 1);
    const nums = Array.from({length:max+1}, (_,n) => `<button class="num ${String(x.qty)===String(n)?'on '+(n<it.qty?'bad':'ok'):''}" data-act="setMed" data-i="${i}" data-k="qty" data-v="${n}" aria-pressed="${String(x.qty)===String(n)}">${n}</button>`).join('');
    const exp = [['valid','سليم','ok'],['expired','منتهي','bad']].map(([v,l,c]) => `<button class="${x.exp===v?'on '+c:''}" data-act="setMed" data-i="${i}" data-k="exp" data-v="${v}" aria-pressed="${x.exp===v}">${l}</button>`).join('');
    return `<div class="item ${cls}"><div class="item-h"><span class="iname">${esc(it.name)}<span class="muted small" style="display:block;font-weight:400">المطلوب: <span class="num">${it.qty}</span></span></span>${st ? chip(ST[st][0], ST[st][1]) : chip('لم يُفحص','neutral')}</div>
      <div class="meds-row"><div class="mgrp"><span class="muted small">الكمية الموجودة</span><div class="seg" role="group" aria-label="الكمية">${nums}</div></div>
      <div class="mgrp"><span class="muted small">الصلاحية</span><div class="seg" role="group" aria-label="الصلاحية">${exp}</div></div></div></div>`;
  }).join('');
  const opts = d.type==='vehicle' ? ['good','attention','defect'] : d.type==='golf' ? ['good','note'] : ['ok','missing','damaged'];
  return list.map((it,i) => {
    const x = d.items[i]||{};
    const cls = x.status ? 's-'+ST[x.status][1] : '';
    const seg = opts.map(o => `<button data-act="set" data-i="${i}" data-v="${o}" class="${x.status===o?'on '+ST[o][1]:''}" aria-pressed="${x.status===o}">${ST[o][0]}</button>`).join('');
    let det = '';
    if(x.status && x.status!=='good' && x.status!=='ok'){
      det = `<div class="detail"><div class="stack" style="gap:8px">
        <textarea id="d-${i}-note" data-d="${i}" data-k="note" placeholder="${d.type==='vehicle'?'وصف المشكلة (مطلوب)':d.type==='golf'?'اكتب الملاحظة':'ملاحظة (اختياري)'}">${esc(x.note||'')}</textarea>
        ${d.type==='vehicle' ? `<label class="f small">الأولوية<select id="d-${i}-pri" data-d="${i}" data-k="pri">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${(x.pri||'medium')===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>` : ''}
        </div>${photoCtl('i'+i, x.photo)}</div>`;
    }
    return `<div class="item ${cls}"><div class="item-h"><span class="iname">${esc(it.name)}${it.qty?`<span class="muted small" style="display:block;font-weight:400">المطلوب: <span class="num">${it.qty}</span></span>`:''}</span><div class="seg" role="group" aria-label="${esc(it.name)}">${seg}</div></div>${det}</div>`;
  }).join('');
}
function progressBar(d){
  const ev = draftEval(d); const pct = ev.total ? Math.round(ev.done/ev.total*100) : 0;
  const statusChip = ev.done<ev.total ? chip('غير مكتمل','neutral') : ev.issues ? chip(`يحتاج إجراء · ${ev.issues}`,'warn') : chip('جاهز','ok');
  return `<div class="prog" id="prog"><div class="prog-in"><div class="row"><span class="bar"><i style="width:${pct}%"></i></span>
    <span class="small">العناصر المفحوصة <b class="num">${ev.done}/${ev.total}</b>${ev.issues?` · النواقص <b class="num">${ev.issues}</b>`:''}</span>${statusChip}</div>
    <button class="btn primary" data-act="submitInsp" ${ev.done<ev.total||!ev.total||!S.uid?'disabled':''}>اعتماد الفحص</button></div></div>`;
}
function savedCard(){
  const s = S.ui.saved; if(!s) return '';

function inspForm(type){

        ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>الموظف</th><th>عدد الفحوصات</th><th>أيام الفحص</th><th>الملاحظات</th><th>آخر فحص</th></tr></thead><tbody>${sorted.map(r => `<tr><td><b>${esc(nm(r.id))}</b></td>
          <td><span class="num">${r.n}</span><span style="display:block;height:6px;border-radius:3px;background:var(--line);margin-top:4px;max-width:160px"><span style="display:block;height:100%;border-radius:3px;background:var(--ok);width:${Math.round(r.n / maxN * 100)}%"></span></span></td>
          <td class="num">${r.days}</td><td class="num">${r.notes}</td><td>${r.last ? fmtDT(r.last) : chip('لا يوجد','bad')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا يوجد أعضاء بعد.</div>'}`;
    }
  } else if(t==='export'){
    const ms = today().slice(0,8) + '01';
    const f = S.ui.expFrom || ms, to = S.ui.expTo || today();
    body = `<div class="card stack"><h2>تحميل البيانات كملف Excel</h2>
      <p class="sub">ملف واحد فيه ورقة لكل قسم: ملخص الفحوصات، تفاصيل كل عنصر، بلاغات الصيانة، التعليمات ومن قرأها، الفريق، وسجل التدقيق.</p>
      <div class="fields"><label class="f">من تاريخ<input type="date" id="expFrom" data-bind="expFrom" value="${f}"></label>
      <label class="f">إلى تاريخ<input type="date" id="expTo" data-bind="expTo" value="${to}"></label></div>
      <div class="row"><button class="btn sm ghost" data-act="expRange" data-v="today">اليوم</button><button class="btn sm ghost" data-act="expRange" data-v="week">آخر 7 أيام</button><button class="btn sm ghost" data-act="expRange" data-v="month">هذا الشهر</button></div>
      <div class="row"><button class="btn primary" data-act="exportXlsx">تحميل ملف Excel</button></div>
      <p class="sub">على الآيباد والجوال يُحفظ الملف في مجلد التنزيلات، ويفتح في Excel أو Numbers.</p></div>
      <div class="card stack"><h2>نسخة كاملة من كل البيانات</h2>
      <p class="sub">كل شيء منذ بداية المنصة في ملف واحد: الفحوصات وتفاصيلها، البلاغات، تبديل النوبات، التعليمات، جداول المناوبات، الفريق، قوائم الفحص، وسجل التدقيق. يُنصح بتحميلها نهاية كل شهر وحفظها.</p>
      <div class="row"><button class="btn primary" data-act="exportAll">تحميل كامل البيانات</button></div></div>
      <div class="card stack"><h2>الأرشيف الشهري</h2>
      <p class="sub">البيانات محفوظة في المنصة ولا تُحذف تلقائيًا. حمّل أي شهر كملف Excel مستقل.</p>
      <div class="list">${archiveMonths().map(m => `<div class="card flat row"><span class="grow"><b class="num">${m}</b> <span class="muted small">· ${new Date(m + '-15').toLocaleDateString(LOC, {month:'long', year:'numeric'})}</span></span><button class="btn sm" data-act="exportMonth" data-v="${m}">تحميل</button></div>`).join('')}</div></div>`;
  } else {
    body = S.audit.length ? `<div class="tbl-wrap"><table><thead><tr><th>الوقت</th><th>الموظف</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${S.audit.map(a=>`<tr><td class="num">${fmtDT(a.at)}</td><td>${esc(nm(a.by))}</td><td>${esc(a.action)}</td><td translate="no">${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد إجراءات مسجلة بعد.</div>';
  }
  return `<div class="stack">${pageHead('لوحة الإدارة','Admin')}<div class="subtabs">${tabs}</div>${body}</div>`;
}



/* ---------- shift swaps ---------- */
function swapsNeedingMe(){
  if(!S.uid) return [];
  return S.swaps.filter(w => S.admin ? w.status==='pending_admin' : ((w.status==='pending_partner' && w.partner===S.uid) || (w.status==='pending_admin' && isSupFor(w.sector))));
}
function fileLink(f, label){
  if(!f || !f.id) return '';
  return /^image\//.test(f.type||'') ? `<a href="#" data-file="${f.id}" target="_blank" rel="noopener"><img class="thumb" data-file="${f.id}" alt="${esc(label)}"></a>`
    : `<a class="btn sm" href="#" data-file="${f.id}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
function fileCtl(key, f){
  const up = S.ui.uploading[key];
  return `<div class="photo-in">${f ? fileLink(f, f.name || 'الملف المرفق') : ''}
    ${up ? '<span class="muted small">جارٍ الرفع…</span>' : `<label class="btn sm" for="fc-${key}">تصوير</label>
    <label class="btn sm" for="fg-${key}">${f ? 'تغيير الملف' : 'من الاستديو أو الملفات'}</label>`}
    <input type="file" id="fc-${key}" accept="image/*" capture="environment" data-upload="${key}">
    <input type="file" id="fg-${key}" accept="image/*,application/pdf" data-upload="${key}"></div>`;
}
function swapCard(w){
  const st = SW[w.status] || [w.status,'neutral'];
  const mine = w.by===S.uid, partner = w.partner===S.uid;
  let acts = '';
  if(partner && w.status==='pending_partner') acts += `<button class="btn primary sm" data-act="swapPartner" data-id="${w.id}" data-v="pending_admin">أوافق على التبديل</button><button class="btn sm ghost danger" data-act="swapPartner" data-id="${w.id}" data-v="declined">أرفض</button>`;
  if(mine && (w.status==='pending_partner' || w.status==='pending_admin')) acts += `<button class="btn sm ghost" data-act="swapCancel" data-id="${w.id}">${S.ui.confirm==='swc'+w.id?'تأكيد الإلغاء':'إلغاء الطلب'}</button>`;
  if(canDecide(w) && (S.admin ? (w.status!=='approved' && w.status!=='rejected' && w.status!=='cancelled') : w.status==='pending_admin')) acts += `<button class="btn primary sm" data-act="swapAdmin" data-id="${w.id}" data-v="approved">اعتماد</button><button class="btn sm ghost danger" data-act="swapAdmin" data-id="${w.id}" data-v="rejected">رفض</button>`;
  if(S.admin) acts += `<button class="btn sm ghost danger" data-act="swapDelete" data-id="${w.id}">${S.ui.confirm==='swd'+w.id?'تأكيد الحذف':'حذف'}</button>`;
  return `<div class="card stack" style="gap:8px"><div class="row"><span class="grow"><b>${esc(nm(w.by))}</b> ⇄ <b>${esc(nm(w.partner))}</b></span>${chip(st[0], st[1])}</div>
    <div class="kv"><dt>نوبة ${esc(nm(w.by))}</dt><dd>${fmtD(w.myDate)} · ${SHIFTS[w.myShift]||''}</dd>
    <dt>نوبة ${esc(nm(w.partner))}</dt><dd>${fmtD(w.partnerDate)} · ${SHIFTS[w.partnerShift]||''}</dd>
    ${w.reason ? `<dt>السبب</dt><dd style="white-space:pre-wrap" translate="no">${esc(w.reason)}</dd>` : ''}
    ${w.adminNote ? `<dt>ملاحظة المسؤول</dt><dd translate="no">${esc(w.adminNote)}</dd>` : ''}</div>
    ${w.form ? `<div class="row small"><span class="muted">النموذج المرفق:</span>${fileLink(w.form, 'فتح النموذج')}</div>` : ''}
    <span class="muted small">قُدّم ${fmtDT(w.at)}${(w.history||[]).length>1 ? ' · ' + w.history.slice(1).map(h => `${(SW[h.status]||[h.status])[0]} ${fmtDT(h.at)} (${esc(nm(h.by))})`).join(' ← ') : ''}</span>
    ${canDecide(w) && w.status!=='approved' && w.status!=='rejected' && w.status!=='cancelled' ? `<input type="text" id="swn-${w.id}" data-bind="swn_${w.id}" placeholder="ملاحظة للطلب (اختياري)" value="${esc(S.ui['swn_'+w.id]||'')}">` : ''}
    ${acts ? `<div class="row">${acts}</div>` : ''}</div>`;
}
function vSwaps(){
  const c = cfg(), tpl = c.swapForm;
  const others = Object.entries(S.users).filter(([id,u]) => id!==S.uid && u.active!==false).sort((a,b) => (a[1].name||'').localeCompare(b[1].name||'', 'ar'));
  const f = S.ui.sw || {};
  const ready = f.partner && f.myDate && f.partnerDate && (!tpl || f.form) && S.uid;
  const form = S.ui.swOpen ? `<div class="card stack"><h2>طلب تبديل نوبة</h2>
    ${tpl ? `<div class="row small"><span>1. حمّل النموذج واملأه ووقّعه أنت وزميلك:</span>${fileLink(tpl, 'تحميل نموذج التبديل')}</div>` : ''}
    <div class="fields">
      <label class="f">الموظف الأول (أنت)<input type="text" id="swMe" value="${esc(S.myName||'')}" disabled></label>
      <label class="f">الموظف الثاني (الزميل)<select id="swPartner" data-sw="partner"><option value="">اختر الزميل</option>${others.map(([id,u]) => `<option value="${id}" ${f.partner===id?'selected':''}>${esc(u.name||u.email||'')}</option>`).join('')}</select></label>
    </div>
    <div class="fields">
      <label class="f">تاريخ نوبتك<input type="date" id="swMyDate" data-sw="myDate" value="${esc(f.myDate||'')}"></label>
      <label class="f">شفت نوبتك<select id="swMyShift" data-sw="myShift">${Object.entries(SHIFTS).map(([k,l]) => `<option value="${k}" ${(f.myShift||'morning')===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f">تاريخ نوبة الزميل<input type="date" id="swPDate" data-sw="partnerDate" value="${esc(f.partnerDate||'')}"></label>
      <label class="f">شفت نوبة الزميل<select id="swPShift" data-sw="partnerShift">${Object.entries(SHIFTS).map(([k,l]) => `<option value="${k}" ${(f.partnerShift||'morning')===k?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <label class="f">السبب (اختياري)<textarea id="swReason" data-sw="reason">${esc(f.reason||'')}</textarea></label>
    <div class="stack" style="gap:6px"><span class="small"><b>${tpl ? '2. ' : ''}إرفاق النموذج الموقّع</b> ${tpl ? '(مطلوب)' : '(اختياري)'}</span>${fileCtl('swap', f.form)}</div>
    <div class="row"><button class="btn primary" data-act="swapSubmit" ${ready?'':'disabled'}>إرسال الطلب</button><button class="btn ghost" data-act="toggle" data-k="swOpen" data-id="1">إلغاء</button></div>
    <p class="sub">يصل الطلب لزميلك ليوافق عليه، ثم للمسؤول ليعتمده.</p></div>` : '';
  const needMe = swapsNeedingMe();
  const filt = S.ui.swFilter || 'open';
  let list = S.admin ? S.swaps : S.swaps.filter(w => w.by===S.uid || w.partner===S.uid || isSupFor(w.sector));
  if(filt==='open') list = list.filter(w => w.status==='pending_partner' || w.status==='pending_admin');
  else if(filt==='done') list = list.filter(w => !(w.status==='pending_partner' || w.status==='pending_admin'));
  const fl = [['open','المعلقة'],['done','المنتهية'],['all','الكل']].map(([k,l]) => `<button data-act="swFilter" data-v="${k}" aria-pressed="${filt===k}">${l}</button>`).join('');
  const tplAdmin = S.admin ? `<div class="card flat stack"><h2>نموذج التبديل الرسمي</h2>
    <p class="sub">ارفع نموذج تبديل النوبة الخاص بالقسم (PDF أو صورة). يظهر للمسعفين ليحملوه ويرفقوه موقّعًا مع الطلب.</p>
    ${fileCtl('swtpl', tpl)}${tpl ? `<div class="row"><button class="btn sm ghost danger" data-act="swapTplRemove">${S.ui.confirm==='swt'?'تأكيد إزالة النموذج':'إزالة النموذج'}</button></div>` : ''}</div>` : '';
  return `<div class="stack">${pageHead('تبديل النوبات','Shift Swap', S.ui.swOpen ? '' : `<button class="btn primary" data-act="swapOpen">طلب تبديل جديد</button>`)}
    ${!S.admin && tpl && !S.ui.swOpen ? `<div class="banner"><span>نموذج التبديل الرسمي متاح للتحميل</span>${fileLink(tpl, 'تحميل النموذج')}</div>` : ''}
    ${form}
    ${needMe.length ? `<h2>${S.admin ? 'بانتظار اعتمادك' : 'بانتظار موافقتك'}</h2><div class="list">${needMe.map(swapCard).join('')}</div>` : ''}
    <h2>${S.admin ? 'كل الطلبات' : 'طلباتي'}</h2><div class="subtabs">${fl}</div>
    ${list.length ? `<div class="list">${list.filter(w => !needMe.includes(w)).map(swapCard).join('') || '<div class="empty">لا توجد طلبات أخرى.</div>'}</div>` : '<div class="empty">لا توجد طلبات هنا.</div>'}
    ${tplAdmin}</div>`;
}


/* ---------- Excel export ---------- */
async function runExport(b, from, to, fname, full){
  if(!window.XLSX){ toast('تعذّر تحميل أداة Excel. تأكد من الإنترنت ثم أعد تحميل الصفحة.'); return; }
  const label = b.textContent; b.disabled = true; b.textContent = 'جارٍ تجهيز الملف…';
  try {
    const db = S.db;
    const D = iso => iso ? new Date(iso).toLocaleDateString('en-CA') : '';
    const T = iso => iso ? new Date(iso).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
    const stl = k => (ST[k] ? ST[k][0] : (k || ''));
    const byRange = async (col, field, lo, hi) => { const q = await db.collection(col).where(field,'>=',lo).where(field,'<=',hi).get();
      return q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => (x[field]||'') < (y[field]||'') ? -1 : 1); };
    const hi = to + '~';
    const ins = await byRange('inspections', 'date', from, to);
    const reps = await byRange('reports', 'at', from, hi);
    const anns = await byRange('announcements', 'at', from, hi);
    const auds = await byRange('audit', 'at', from, hi);
    let swaps = [];
    try { swaps = await byRange('swaps', 'at', from, hi); } catch(e){}
    const scheds = full ? await byRange('schedules', 'publishedAt', from, hi) : [];
    let pws = [], cos = [], recs = [];
    try { pws = await byRange('pathways', 'at', from, hi); } catch(e){}
    try { cos = await byRange('checkouts', 'at', from, hi); } catch(e){}
    let ros = []; try { ros = await byRange('rosc', 'at', from, hi); } catch(e){}
    let mcs = []; try { mcs = await byRange('mchecks', 'at', from, hi); } catch(e){}
    if(full){ try { recs = await byRange('records', 'at', from, hi); } catch(e){} }

    const summary = ins.map(i => ({'التاريخ': i.date, 'الوقت': T(i.at), 'السيارة': i.ambulance, 'نوع الفحص': TYPES[i.type] || i.type,
      'الشفت': SHIFTS[i.shift] || '', 'الموظف': nm(i.by), 'عدد العناصر': i.total, 'النواقص والأعطال': i.issues,
      'الحالة': i.status === 'ready' ? 'جاهز' : 'يحتاج إجراء'}));
    const detail = [];
    ins.forEach(i => (i.items || []).forEach(x => detail.push({'التاريخ': i.date, 'الوقت': T(i.at), 'السيارة': i.ambulance,
      'نوع الفحص': TYPES[i.type] || i.type, 'الموظف': nm(i.by), 'العنصر': x.name, 'الحالة': stl(x.status),
      'المطلوب': x.req ?? '', 'الموجود': x.qty ?? '', 'الصلاحية': x.exp ? expLabel(x.exp) : '',
      'الأولوية': x.priority ? PRI[x.priority][0] : '', 'ملاحظة': x.note || '', 'صورة مرفقة': x.photo ? 'نعم' : ''})));
    const reports = reps.map(r => { const last = (r.history || []).slice(-1)[0];
      return {'تاريخ البلاغ': D(r.at), 'الوقت': T(r.at), 'السيارة': r.ambulance, 'العنصر': r.item, 'الوصف': r.desc || '',
        'الأولوية': PRI[r.priority || 'medium'][0], 'الحالة': RST[r.status][0], 'المُبلّغ': nm(r.by),
        'المصدر': r.source === 'inspection' ? 'من فحص السيارة' : 'بلاغ يدوي',
        'آخر تحديث': last ? `${D(last.at)} ${T(last.at)}` : '', 'حدّثه': last ? nm(last.by) : '', 'صورة مرفقة': r.photo ? 'نعم' : ''}; });
    const members = Object.entries(S.users).filter(([id,u]) => u.active !== false).map(([id]) => id);
    const annRows = anns.map(a => { const readers = members.filter(u => S.acks[u] && S.acks[u][a.id]);
      const unread = members.filter(u => u !== a.by && !(S.acks[u] && S.acks[u][a.id]));
      return {'التاريخ': D(a.at), 'التعليمة': a.body, 'الناشر': nm(a.by), 'عدد من قرأ': readers.length,
        'قرأها': readers.map(nm).join('، '), 'لم يقرأها': unread.map(nm).join('، ')}; });
    const swapRows = swaps.map(w => ({'تاريخ الطلب': D(w.at), 'الوقت': T(w.at), 'الموظف الأول': nm(w.by), 'نوبته': `${w.myDate} ${SHIFTS[w.myShift]||''}`,
      'الموظف الثاني': nm(w.partner), 'نوبته ': `${w.partnerDate} ${SHIFTS[w.partnerShift]||''}`, 'السبب': w.reason || '',
      'الحالة': (SW[w.status]||[w.status])[0], 'ملاحظة المسؤول': w.adminNote || '', 'نموذج مرفق': w.form ? 'نعم' : ''}));
    const team = Object.entries(S.users).map(([id,u]) => { const mine = ins.filter(i => i.by === id);
      return {'الاسم': u.name || '', 'الإيميل': u.email || '', 'الصلاحية': (ROLES[u.role]||ROLES.paramedic)[0],
        'الحالة': u.active === false ? 'موقوف' : 'فعّال', 'تاريخ الانضمام': D(u.at), 'فحوصات الفترة': mine.length,
        'آخر فحص في الفترة': mine.length ? `${mine[mine.length-1].date} ${T(mine[mine.length-1].at)}` : ''}; });
    const audRows = auds.map(a => ({'التاريخ': D(a.at), 'الوقت': T(a.at), 'الموظف': nm(a.by), 'الإجراء': a.action, 'التفاصيل': a.detail || ''}));
    const schedRows = scheds.map(x => ({'الشهر': x.month, 'تاريخ النشر': D(x.publishedAt), 'الناشر': nm(x.by), 'الملاحظات': x.note || '', 'اسم الملف': x.fileName || ''}));
    const c = cfg(), listRows = [];
    (c.ambulances||[]).forEach(n => listRows.push({'القائمة': 'السيارات', 'العنصر': n, 'الكمية المطلوبة': ''}));
    (c.vehicleItems||[]).forEach(n => listRows.push({'القائمة': 'فحص السيارة', 'العنصر': n, 'الكمية المطلوبة': ''}));
    [['cpr','شنطة CPR'],['paramedic','شنطة المسعف'],['meds','شنطة الأدوية']].forEach(([k,l]) => (c[k]||[]).forEach(n => listRows.push({'القائمة': l, 'العنصر': typeof n==='string' ? n : n.name, 'الكمية المطلوبة': typeof n==='string' ? '' : n.qty})));

    const wb = XLSX.utils.book_new();
    wb.Workbook = {Views: [{RTL: LANG !== 'en'}]};
    const add = (rows, name, empty) => {
      rows = rows.map(trRow);
      const ws = rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([[tr(empty)]]);
      if(rows.length){ const keys = Object.keys(rows[0]);
        ws['!cols'] = keys.map(k => ({wch: Math.min(60, Math.max(k.length, ...rows.map(r => String(r[k] ?? '').length)) + 2)}));
        ws['!autofilter'] = {ref: ws['!ref']}; }
      XLSX.utils.book_append_sheet(wb, ws, tr(name).slice(0,31));
    };
    add(summary, 'ملخص الفحوصات', 'لا توجد فحوصات في هذه الفترة');
    add(detail, 'تفاصيل الفحوصات', 'لا توجد فحوصات في هذه الفترة');
    add(reports, 'بلاغات الصيانة', 'لا توجد بلاغات في هذه الفترة');
    add(swapRows, 'تبديل النوبات', 'لا توجد طلبات تبديل في هذه الفترة');
    add(pathwayRows(pws), 'تفعيل المسارات', 'لا توجد تفعيلات في هذه الفترة');
    add(checkoutRows(cos), 'ساعات الخروج', 'لا توجد طلبات في هذه الفترة');
    add(roscRows(ros), 'حالات ROSC', 'لا توجد حالات في هذه الفترة');
    add(mcheckRows(mcs), 'فحوصات الصيانة', 'لا توجد فحوصات صيانة في هذه الفترة');

function archiveMonths(){
  const starts = Object.values(S.users).map(u => u.at).filter(Boolean).sort();
  const first = starts[0] ? new Date(starts[0]) : new Date();
  const out = [], d = new Date(first.getFullYear(), first.getMonth(), 1), now = new Date();
  while(d <= now && out.length < 120){ out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); d.setMonth(d.getMonth()+1); }
  return out.reverse();
}

async function exportSheet(b, fname, sheet, rows, empty){

async function wipe(col, keep){

function mkCtx(c, ym, staff, prefs, locks, keep, w){

  const sm = Object.fromEntries(staff.map(x => [x.id, x]));
  const P = u => prefs[u] || {};

    pref: (u,d) => ((P(u).days||{})[d]) || '',

    home: u => sm[u] ? sm[u].home : '',

      return u => { const v = ((pr.assign||{})[u]||{})[pn], q = isW(v) && pBy[v]; return q ? q.st + q.h - 24 : null; }; })(),
    prevRun: (() => { const pr = (S.rosters||[]).find(r => r.month===prevYm(ym)); if(!pr) return () => 0; const pn = dim(pr.month);
      return u => { const row = (pr.assign||{})[u]||{}; let k = 0; while(k < pn && isW(row[pn-k]) && row[pn-k]!=='tb') k++; return k; }; })(),

  const k = x.by[key].sh.kind;

  const ds = Array.from({length:n}, (_,i) => day(i+1));

    <div class="tbl-wrap"><table class="grid-r" translate="no"><thead>${head}</thead><tbody>${rows}

function statRange(per){
  const d = new Date(), iso = x => x.toLocaleDateString('en-CA');
  if(per === 'week'){ const w = new Date(); w.setDate(w.getDate() - 6); return {from: iso(w), to: iso(d)}; }
  if(per === 'prev'){ const a = new Date(d.getFullYear(), d.getMonth() - 1, 1), z = new Date(d.getFullYear(), d.getMonth(), 0); return {from: iso(a), to: iso(z)}; }
  if(per === 'all') return {from: '0000-00-00', to: '9999-12-31'};
  return {from: iso(d).slice(0,8) + '01', to: iso(d)};
}
async function loadStats(key, rng){

}

const AUTH_ERR = {'auth/invalid-email':'صيغة البريد غير صحيحة.','auth/missing-password':'اكتب كلمة المرور.','auth/weak-password':'كلمة المرور قصيرة: 6 أحرف على الأقل.',
  'auth/email-already-in-use':'هذا البريد لديه حساب. استخدم تسجيل الدخول.','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة.',

document.addEventListener('submit', async e => {
  if(e.target.id !== 'authForm') return; e.preventDefault();
  const v = id => (document.getElementById(id)||{}).value || '';
  const email = v('aEmail').trim().toLowerCase(), pass = v('aPass'), name = v('aName').trim();
  S.authErr = '';
  if(S.authMode==='register' && !name){ S.authErr = 'اكتب اسمك الكامل.'; render(); return; }
  S.authBusy = true; render();
  try {
    const auth = firebase.auth();
    if(S.authMode==='login') await auth.signInWithEmailAndPassword(email, pass);
    else if(S.authMode==='register'){ S.pendingName = name; await auth.createUserWithEmailAndPassword(email, pass); }
    else { await auth.sendPasswordResetEmail(email); S.authMode = 'login'; toast('أرسلنا رابط استعادة كلمة المرور إلى بريدك'); }
  } catch(err){ console.error(err); S.authErr = AUTH_ERR[err.code] || 'تعذّر الإجراء. أعد المحاولة.'; }
  S.authBusy = false; render();
});
async function enterApp(u){
  const db = S.db;
  S.gate = 'loading'; render();
  try {
    let me = await db.doc('users/'+u.uid).get();
    if(!me.exists){
      const name = S.pendingName || u.email.split('@')[0];
      const owner = await db.doc('meta/owner').get();
      if(!owner.exists){
        const b = db.batch();
        b.set(db.doc('meta/owner'), {uid:u.uid, at:new Date().toISOString()});
        b.set(db.doc('users/'+u.uid), {name, role:'admin', email:u.email, active:true, at:new Date().toISOString()});
        await b.commit();
        const c = await db.doc('config/main').get();
        if(!c.exists) await db.doc('config/main').set(Object.assign({}, DEFAULT_CONFIG, {updatedAt:new Date().toISOString(), updatedBy:u.uid}));
      } else {
        try { let role = 'paramedic'; try { const al = await db.doc('allowed/'+u.email.toLowerCase()).get(); if(al.exists && al.data().role==='maintenance') role = 'maintenance'; } catch(e){}
          await db.doc('users/'+u.uid).set({name, role, email:u.email, active:true, at:new Date().toISOString()}); }
        catch(e){ S.gate = 'denied'; render(); return; }
      }
      me = await db.doc('users/'+u.uid).get();
    }
    const d = me.data();
    if(d.active === false){ S.gate = 'inactive'; render(); return; }
    S.uid = u.uid; S.myName = d.officialName || d.name; S.admin = d.role==='admin'; S.maint = d.role==='maintenance'; S.sup = d.role==='supervisor'; S.mySector = d.sector || ''; if(S.maint) S.view = 'mcheck'; S.gate = null;
    startData();
  } catch(e){ console.error(e); S.noDb = 'تعذّر الاتصال بقاعدة البيانات. تأكد من الإنترنت ومن نشر قواعد الأمان (Rules) ثم أعد تحميل الصفحة.'; render(); }
}

  else if(t.dataset.md){ const d = mDraft(); d[t.dataset.md] = t.value; if(t.dataset.md==='ambulance'){ const last = S.mchecks.find(x => x.ambulance===t.value); if(last){ d.plate = last.plate||''; d.model = last.model||''; d.vtype = last.vtype||''; } } if(t.tagName==='SELECT') R(); }

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b || file;
  } catch(e){ return file; }
}

function nameTokens(s){ return normAr(s).split(' ').filter(t => t.length > 1 && !['بن','بنت','ابن'].includes(t)).map(t => t.replace(/^ال(?=..)/,'')); }
function nameScore(a, b){
  const A = nameTokens(a), B = nameTokens(b); if(!A.length || !B.length) return 0;
  const used = new Set(); let m = 0;
  A.forEach(t => { const i = B.findIndex((x,j) => !used.has(j) && (x===t || (t.length>3 && x.length>3 && (x.startsWith(t) || t.startsWith(x))))); if(i >= 0){ used.add(i); m++; } });
  const mn = Math.min(A.length, B.length); let s = m / mn; if(mn < 2) s *= 0.6;
  return Math.round(s*100)/100;
}

/* ---------- chunked binary storage in Firestore (free plan, no Storage) ---------- */
const CHUNK = 700000;
function bytesToB64(u8){ let s = ''; for(let i=0; i<u8.length; i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); }
function b64ToBytes(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0; i<bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function sha256(u8){ try { const h = await crypto.subtle.digest('SHA-256', u8); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join(''); } catch(e){ return ''; } }
async function putChunks(col, base, u8, extra){
  const b64 = bytesToB64(u8), n = Math.max(1, Math.ceil(b64.length / CHUNK));
  for(let i=0; i<n; i++) await S.db.doc(`${col}/${base}_${i}`).set(Object.assign({b64:b64.slice(i*CHUNK, (i+1)*CHUNK), i, n, by:S.uid, at:new Date().toISOString()}, extra||{}));
  return n;
}
const chunkCache = {};
function getChunks(col, base, n){
  const k = col + '/' + base;
  if(!chunkCache[k]){ chunkCache[k] = (async () => { const parts = await Promise.all(Array.from({length:n}, (_,i) => S.db.doc(`${col}/${base}_${i}`).get()));
    return b64ToBytes(parts.map(p => { const d = p.data(); if(!d) throw new Error('missing'); return d.b64; }).join('')); })(); chunkCache[k].catch(() => { delete chunkCache[k]; }); }
  return chunkCache[k];
}
function saveBytes(u8, fname){ const url = URL.createObjectURL(new Blob([u8], {type:'application/pdf'})); const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); }

  let iNe = f(/انجليز|english|en name|full name/), iN = h.findIndex((x,i) => i!==iNe && /اسم|name/.test(x));
  const iS = f(/قطاع|sector|موقع/), iT = f(/مسمي|title|وظيفه|job/), iM = f(/بريد|ايميل|mail/), iP = f(/جوال|mobile|phone|هاتف/), iI = f(/هويه|اقامه|iqama|national/), iL = f(/ترخيص|license|scfhs|هيئه/);

function analyzeImport(rows){

  return out;

function wrapLines(ctx, text, maxW){ const out = []; String(text).split('\n').forEach(par => { const words = par.split(/\s+/).filter(Boolean); if(!words.length){ out.push(''); return; } let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if(ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }); out.push(line); }); return out; }
function loadImg(src){ return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
const FONT = w => `${w} {s}px "IBM Plex Sans Arabic", Tahoma, "Geeza Pro", sans-serif`;
const font = (w, s) => FONT(w).replace('{s}', s);
async function docFonts(){ try { await document.fonts.load(font(400, 20)); await document.fonts.load(font(700, 20)); } catch(e){} }
async function canvasPage(drawFn){ const W = 1240, H = 1754; const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H); ctx.direction = LANG==='en' ? 'ltr' : 'rtl'; await drawFn(ctx, W, H); return cv; }

async function doSign(b, kind){
  const c = S.circs.find(x => x.id===b.dataset.id), me = S.users[S.uid] || {}; if(!c) return;
  if(!me.empNo){ toast('اربط حسابك برقمك الوظيفي أولًا.'); return; }
  if(!S.ui.sigConsent || (kind==='sign' && !(S.ui.sigStrokes||[]).length)) return;
  const l = b.textContent; b.disabled = true; b.textContent = kind==='sign' ? 'جارٍ توقيع المستند…' : 'جارٍ الحفظ…';
  try {
    const when = Date.now(), token = Math.random().toString(36).slice(2,10);
    const rec = {circ:c.id, ref:c.ref, ver:c.ver||1, title:c.title, by:S.uid, name:me.officialName, empNo:me.empNo, sector:me.sector||'', kind, signedAt:FV().serverTimestamp(), clientAt:new Date(when).toISOString(),
      late:isLate(c), docHash:c.fileHash||'', token, n:0, size:0, signedHash:'', ua:String(navigator.userAgent||'').slice(0,200)};
    if(kind==='sign'){
      const bytes = await signedPdf(c, me, S.ui.sigStrokes, when);
      rec.signedHash = await sha256(bytes); rec.size = bytes.length;
      rec.sigPng = sigPng(S.ui.sigStrokes, 300, 120).toDataURL('image/png');
      rec.n = await putChunks('csigned', `${c.id}_${S.uid}_${token}`, bytes, {circ:c.id, token, sector:me.sector||''});
      chunkCache['csigned/' + `${c.id}_${S.uid}_${token}`] = Promise.resolve(bytes);
    }
    await S.db.doc('csigs/' + c.id + '_' + S.uid).set(rec);
    audit(kind==='sign' ? 'توقيع تعميم إلكترونيًا' : 'إقرار بالاطلاع على تعميم', `${c.ref} v${c.ver||1} · ${me.empNo}`);
    S.ui.signing = false; S.ui.sigStrokes = []; S.ui.sigConsent = false; toast(kind==='sign' ? 'تم التوقيع وحُفظت نسختك الموقعة' : 'تم تسجيل إقرارك');
  } catch(e){ console.error(e); b.disabled = false; b.textContent = l; e && e.message==='lib' ? toast('تعذّر تحميل أداة PDF. تأكد من الإنترنت.') : failMsg(e); return; }
  render();
}

function applyChanges(r){
  const ch = (S.rchanges||[]).filter(c => c.month===r.month).sort((a,b) => a.at < b.at ? -1 : 1); if(!ch.length) return r;
  const x = Object.assign({}, r, {assign: clone(r.assign||{}), changed:{}});
  ch.forEach(c => { const row = x.assign[c.uid] = x.assign[c.uid] || {}; if(!c.to || c.to==='off') delete row[c.day]; else row[c.day] = c.to; (x.changed[c.uid] = x.changed[c.uid] || {})[c.day] = c.kind; });
  return x;
}
function refreshRosters(){ S.rosters = (S.rostersRaw||[]).map(applyChanges); }
function rosterFor(ym){ return S.rosters.find(r => r.month===ym); }
function cellOf(uid, date){ const r = rosterFor(ymOf(date)); if(!r) return null; return ((r.assign||{})[uid]||{})[dayOf(date)] || 'off'; }
function cellTxt(uid, date){ const v = cellOf(uid, date); if(v===null) return 'لا يوجد جدول منشور لهذا الشهر'; if(v==='off') return 'راحة'; if(v==='tb') return 'تايم باك'; const r = rosterFor(ymOf(date)), x = slotBy({sites:r.sites})[v]; return x ? `${x.site.name} · ${x.sh.name} ${x.sh.start}–${x.sh.end}` : v; }
async function writeChanges(list, reqId, kind){
  list = list.filter(c => c.from !== null && c.from !== c.to); if(!list.length) return 0;
  const b = S.db.batch(), t = Date.now();
  list.forEach((c,i) => b.set(S.db.collection('rchanges').doc(), {month:ymOf(c.date), day:dayOf(c.date), uid:c.uid, from:c.from, to:c.to, kind, reqId:reqId||'', by:S.uid, at:new Date(t+i).toISOString(), sector:userSec(c.uid)}));
  await b.commit(); return list.length;
}
function swapChanges(w){ const out = []; Array.from(new Set([w.myDate, w.partnerDate])).forEach(dt => { const a = cellOf(w.by, dt), p = cellOf(w.partner, dt); if(a===null) return;
  out.push({uid:w.by, date:dt, from:a, to:p}); out.push({uid:w.partner, date:dt, from:p, to:a}); }); return out; }

/* ---------- balances ---------- */
function balanceOf(uid){
  const ex = S.extras.filter(x => x.uid===uid && x.status==='approved');
  const rest = ex.filter(x => x.kind==='restday').length, otH = ex.filter(x => x.kind==='ot').reduce((a,x) => a + (+x.hours||0), 0), adj = ex.filter(x => x.kind==='adjust').reduce((a,x) => a + (+x.days||0), 0);
  const tb = S.tbreqs.filter(t => t.uid===uid);
  const used = tb.filter(t => t.status==='approved').reduce((a,t) => a + (t.days||0), 0), pend = tb.filter(t => t.status==='pending').reduce((a,t) => a + (t.days||0), 0);
  const earned = rest + otH/8 + adj;
  const orc = ex.filter(x => !x.oracle).length + tb.filter(t => t.status==='approved' && !t.oracle).length;
  return {rest, otH, adj, earned:r1(earned), used:r1(used), pend:r1(pend), remaining:r1(earned - used), orc};
}
function monthStats(uid, ym){
  const r = rosterFor(ym); const es = r ? rosterEntries(r, uid) : [];
  const hrs = es.reduce((a,e) => a + e.x.h, 0), tbDays = r ? Object.values((r.assign||{})[uid]||{}).filter(v => v==='tb').length : 0;
  const ex = S.extras.filter(x => x.uid===uid && x.status==='approved' && ymOf(x.date)===ym && x.kind!=='adjust');
  const exH = ex.reduce((a,x) => a + (+x.hours||0), 0);
  const co = S.checkouts.filter(c => c.by===uid && c.status==='approved' && ymOf(c.date)===ym).reduce((a,c) => a + (c.minutes||0), 0);
  return {has:!!r, days:es.length, hrs, target: r ? +r.target||0 : 0, exH, exN:ex.length, rest:ex.filter(x => x.kind==='restday').length, tbDays, coMin:co};
}
function hoursCard(uid){

  const col = (lbl, s) => `<div class="card flat stack" style="gap:4px"><b class="small">${esc(ymLabel(lbl))}</b>${s.has ? `<dl class="kv" style="display:grid"><dt>ساعات الجدول</dt><dd class="num">${s.hrs}${s.target ? ` / ${s.target}` : ''}</dd><dt>أيام العمل</dt><dd class="num">${s.days}</dd>
      <dt>الأوفر تايم (مناوبات إضافية)</dt><dd class="num">${s.exH} ساعة</dd><dt>عمل في أيام الراحة</dt><dd class="num">${s.rest}</dd><dt>أيام تايم باك مستخدمة</dt><dd class="num">${s.tbDays}</dd><dt>ساعات الخروج المعتمدة</dt><dd class="num">${fmtMin(s.coMin)}</dd></dl>` : '<span class="muted small">لا يوجد جدول منشور</span>'}</div>`;
  return `<div class="card stack"><div class="head-line"><div><div class="en">Hours · Overtime · Time-back</div><h2>الساعات والأوفر تايم والتايم باك</h2></div>${b.orc ? chip(b.orc + ' قيد لم يُدخل في Oracle','warn') : chip('مُدخل في Oracle','ok')}</div>
    <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${[['المستحق', b.earned, 'info'],['المستخدم', b.used, 'warn'],['المتبقي', b.remaining, b.remaining > 0 ? 'ok' : 'warn']].map(([l,v,k]) => `<div class="card flat stack" style="gap:2px"><span class="muted small">${l} (يوم)</span><b class="num" style="font-size:24px;color:var(--${k})">${v}</b></div>`).join('')}</div>
    <p class="sub">المستحق = أيام العمل في الراحة (${b.rest}) + ساعات الأوفر تايم ÷ 8 (${r1(b.otH)} ساعة)${b.adj ? ` + رصيد افتتاحي/تعديل (${b.adj})` : ''}${b.pend ? ` · طلبات قيد الاعتماد: ${b.pend} يوم` : ''}</p>
    <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${col(ym, cur)}${col(prevYm(ym), pv)}</div>

function ledgerRows(uid){

  return ex.concat(tb).sort((a,b) => a.at < b.at ? 1 : -1);

function exHours(){ const k = S.ui.exSlot; if(k){ const x = slotBy(schedCfg())[k]; if(x) return x.h; } return +S.ui.exHours || 0; }
function canDecideReq(x){ return S.admin || (isSupFor(x.sector) && x.uid !== S.uid); }

function vTimeback(){

    <label class="f">السبب (اختياري)<input type="text" id="tbReason" data-bind="tbReason" value="${esc(S.ui.tbReason||'')}"></label>

    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>الموظف</th><th>الرقم</th><th>ساعات الشهر</th><th>أوفر تايم</th><th>مستحق</th><th>مستخدم</th><th>متبقٍ</th><th>Oracle</th></tr></thead><tbody>${rows.map(r => `<tr style="cursor:pointer" data-act="balOpen" data-id="${r.id}"><td><b translate="no">${esc(r['الموظف'])}</b><span class="tiny">${esc(r['القطاع'])}</span></td><td class="mono">${esc(r['الرقم الوظيفي'])}</td><td class="num">${r['ساعات الشهر']}</td><td class="num">${r['الأوفر تايم (ساعات)']}</td><td class="num">${r['الرصيد المستحق']}</td><td class="num">${r['المستخدم']}</td><td class="num"><b>${r['المتبقي']}</b></td><td>${r['قيود لم تُدخل في Oracle'] ? chip(r['قيود لم تُدخل في Oracle'] + ' لم يُدخل','warn') : chip('مكتمل','ok')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا يوجد موظفون.</div>'}
    <h2>التعديلات المعتمدة على جدول ${esc(ymLabel(ym))}</h2>
    ${chg.length ? `<div class="tbl-wrap"><table><thead><tr><th>الموظف</th><th>اليوم</th><th>من</th><th>إلى</th><th>السبب</th><th>بواسطة</th><th></th></tr></thead><tbody>${chg.map(c => `<tr><td translate="no">${esc(nm(c.uid))}</td><td class="num">${c.day}</td><td class="small">${esc(val(c, c.from))}</td><td class="small"><b>${esc(val(c, c.to))}</b></td><td>${esc(KN[c.kind]||c.kind)}</td><td class="small">${esc(nm(c.by))}<span class="tiny">${fmtDT(c.at)}</span></td><td><button class="btn sm ghost danger" data-act="rcDel" data-id="${c.id}">${S.ui.confirm==='rcd'+c.id ? 'تأكيد التراجع' : 'تراجع'}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد تعديلات على جدول هذا الشهر.</div>'}</div>`;
}
function extraRows(list){ return list.map(x => ({'الموظف': nm(x.uid), 'الرقم الوظيفي': empNoOf(x.uid), 'القطاع': secName(x.sector), 'النوع': EXK[x.kind][0], 'التاريخ': x.date||'', 'الساعات': x.hours||'', 'الأيام': x.kind==='adjust' ? x.days : x.kind==='restday' ? 1 : r1((+x.hours||0)/8), 'المناوبة': x.slotName||'', 'ملاحظة': x.note||'', 'الحالة': (RQ[x.status]||[x.status])[0], 'المعتمد': x.decidedBy ? nm(x.decidedBy) : '', 'Oracle': x.oracle ? 'تم الإدخال' : 'لم يُدخل', 'تاريخ الطلب': xD(x.at)})); }
function tbRows(list){ return list.map(x => ({'الموظف': nm(x.uid), 'الرقم الوظيفي': empNoOf(x.uid), 'القطاع': secName(x.sector), 'الأيام': x.days, 'التواريخ': (x.dates||[]).join('، '), 'السبب': x.reason||'', 'الحالة': (RQ[x.status]||[x.status])[0], 'المعتمد': x.decidedBy ? nm(x.decidedBy) : '', 'Oracle': x.oracle ? 'تم الإدخال' : 'لم يُدخل', 'تاريخ الطلب': xD(x.at)})); }

/* ---------- actions ---------- */
Object.assign(ACT, {
  tbAdd(){ const d = S.ui.tbDate; if(!d) return; S.ui.tbDates = Array.from(new Set((S.ui.tbDates||[]).concat([d]))).sort(); S.ui.tbDate = ''; render(); },
  tbDel(b){ S.ui.tbDates = (S.ui.tbDates||[]).filter(x => x!==b.dataset.v); render(); },
  exKind(b){ S.ui.exKind = b.dataset.v; render(); },
  exMode(b){ S.ui.exMode = b.dataset.v; render(); },
  async tbSubmit(b){
    const dates = S.ui.tbDates || [], bal = balanceOf(S.uid); if(!dates.length) return;
    if(dates.length > bal.remaining - bal.pend){ toast('عدد الأيام أكبر من رصيدك المتاح.'); return; }
    b.disabled = true; const now = new Date().toISOString();
    try { await S.db.collection('tbreqs').add({uid:S.uid, by:S.uid, sector:S.mySector||'', dates, days:dates.length, reason:(S.ui.tbReason||'').trim(), status:'pending', oracle:false, at:now, history:[{at:now, by:S.uid, status:'pending'}]});
      audit('طلب تايم باك', `${dates.length} يوم · ${dates.join('، ')}`); S.ui.tbDates = []; S.ui.tbReason = ''; toast('تم إرسال الطلب للاعتماد'); } catch(e){ failMsg(e); }
    b.disabled = false; render();
  },
  async exSubmit(b){
    const direct = (S.admin || S.sup) && S.ui.exMode, uid = direct ? S.ui.exFor : S.uid; if(!uid || !S.ui.exDate) return;
    const kind = S.ui.exKind || 'ot', h = exHours(); if(!(h > 0)) return;
    const slot = S.ui.exSlot || '', sx = slot ? slotBy(schedCfg())[slot] : null, now = new Date().toISOString(), st = direct ? 'approved' : 'pending';
    const doc = {uid, by:S.uid, sector:userSec(uid), kind, date:S.ui.exDate, hours:h, slot, slotName: sx ? `${sx.site.name} · ${sx.sh.name} ${sx.sh.start}–${sx.sh.end}` : '', note:(S.ui.exNote||'').trim(), status:st, oracle:false, at:now, history:[{at:now, by:S.uid, status:st}]};
    if(direct){ doc.decidedBy = S.uid; doc.decidedAt = now; }
    b.disabled = true;
    try { const ref = await S.db.collection('extras').add(doc);
      if(direct && slot){ const n = await writeChanges([{uid, date:doc.date, from:cellOf(uid, doc.date), to:slot}], ref.id, 'extra'); if(n) await S.db.doc('extras/'+ref.id).update({changes:n}).catch(() => {}); }
      audit(direct ? 'تسجيل عمل إضافي معتمد' : 'طلب تسجيل عمل إضافي', `${nm(uid)} · ${EXK[kind][0]} · ${doc.date} · ${h} ساعة`);
      Object.assign(S.ui, {exDate:'', exHours:'', exSlot:'', exNote:''}); toast(direct ? 'تم التسجيل والاعتماد' : 'تم إرسال الطلب للاعتماد'); } catch(e){ failMsg(e); }
    b.disabled = false; render();
  },
  async rqDecide(b){
    const col = b.dataset.c, list = col==='tbreqs' ? S.tbreqs : S.extras, x = list.find(k => k.id===b.dataset.id); if(!x) return;
    const v = b.dataset.v, now = new Date().toISOString(), note = (S.ui['rqn_'+x.id]||'').trim();
    const upd = {status:v, decidedAt:now, decidedBy:S.uid, history:[...(x.history||[]), {at:now, by:S.uid, status:v}]}; if(note) upd.adminNote = note;
    b.disabled = true;
    try { await S.db.doc(col + '/' + x.id).update(upd);
      let n = 0;
      if(v==='approved'){ if(col==='tbreqs') n = await writeChanges((x.dates||[]).map(d => ({uid:x.uid, date:d, from:cellOf(x.uid, d), to:'tb'})), x.id, 'tb');
        else if(x.slot) n = await writeChanges([{uid:x.uid, date:x.date, from:cellOf(x.uid, x.date), to:x.slot}], x.id, 'extra'); }
      audit(`${v==='approved' ? 'اعتماد' : 'رفض'} ${col==='tbreqs' ? 'طلب تايم باك' : 'عمل إضافي'}`, `${nm(x.uid)}${n ? ' · ' + n + ' تعديل على الجدول' : ''}`);
      toast(v==='approved' ? (n ? `تم الاعتماد وتحديث الجدول (${n})` : 'تم الاعتماد') : 'تم الرفض'); } catch(e){ failMsg(e); }
    b.disabled = false;
  },
  async rqCancel(b){ const col = b.dataset.c, id = b.dataset.id; if(S.ui.confirm !== 'rqc'+id){ S.ui.confirm = 'rqc'+id; render(); return; } S.ui.confirm = null;
    const x = (col==='tbreqs' ? S.tbreqs : S.extras).find(k => k.id===id); if(!x) return; const now = new Date().toISOString();
    try { await S.db.doc(col+'/'+id).update({status:'cancelled', history:[...(x.history||[]), {at:now, by:S.uid, status:'cancelled'}]}); audit('إلغاء طلب', col); } catch(e){ failMsg(e); } },
  async rqDelete(b){ const col = b.dataset.c, id = b.dataset.id; if(S.ui.confirm !== 'rqd'+id){ S.ui.confirm = 'rqd'+id; render(); return; } S.ui.confirm = null;
    try { await S.db.doc(col+'/'+id).delete(); audit('حذف طلب', col + ' · ' + id); } catch(e){ failMsg(e); } },
  async oracleTog(b){ const col = b.dataset.c, x = (col==='tbreqs' ? S.tbreqs : S.extras).find(k => k.id===b.dataset.id); if(!x) return; const now = new Date().toISOString();
    try { await S.db.doc(col+'/'+x.id).update({oracle:!x.oracle, oracleAt:now, oracleBy:S.uid}); audit(x.oracle ? 'إلغاء تحديد إدخال Oracle' : 'تحديد كمُدخل في Oracle', `${nm(x.uid)} · ${col==='tbreqs' ? 'تايم باك' : EXK[x.kind][0]}`); } catch(e){ failMsg(e); } },
  async adjAdd(b){ const id = b.dataset.id, days = +S.ui.adjDays; if(!days){ toast('اكتب عدد الأيام.'); return; } const now = new Date().toISOString();
    try { await S.db.collection('extras').add({uid:id, by:S.uid, sector:userSec(id), kind:'adjust', days, hours:0, date:today(), note:(S.ui.adjReason||'').trim() || 'رصيد افتتاحي', status:'approved', oracle:false, decidedBy:S.uid, decidedAt:now, at:now, history:[{at:now, by:S.uid, status:'approved'}]});
      audit('تعديل رصيد تايم باك', `${nm(id)} · ${days} يوم`); S.ui.adjDays = ''; S.ui.adjReason = ''; toast('تم حفظ الرصيد'); } catch(e){ failMsg(e); } render(); },
  balOpen(b){ S.ui.balUid = b.dataset.id; render(); window.scrollTo(0,0); },
  balBack(){ S.ui.balUid = null; render(); },
  async balX(b){ const ym = S.ui.balMonth || today().slice(0,7); const bk = mcheckBook(`EMS_الأرصدة_والأوفر_تايم_${ym}.xlsx`); if(!bk) return;
    bk.add(balRows(ym).map(r => { const o = Object.assign({}, r); delete o.id; return o; }), 'الأرصدة ' + ym, 'لا يوجد'); bk.add(extraRows(S.extras), 'العمل الإضافي', 'لا يوجد'); bk.add(tbRows(S.tbreqs), 'طلبات التايم باك', 'لا يوجد'); bk.save(); },
  async ledgerX(b){ const id = b.dataset.id; const bk = mcheckBook(`EMS_سجل_الرصيد_${empNoOf(id) || id}.xlsx`); if(!bk) return; bk.add(extraRows(S.extras.filter(x => x.uid===id)), 'العمل الإضافي', 'لا يوجد'); bk.add(tbRows(S.tbreqs.filter(x => x.uid===id)), 'التايم باك', 'لا يوجد'); bk.save(); },
  async rcDel(b){ const id = b.dataset.id; if(S.ui.confirm !== 'rcd'+id){ S.ui.confirm = 'rcd'+id; render(); return; } S.ui.confirm = null;
    try { await S.db.doc('rchanges/'+id).delete(); audit('تراجع عن تعديل في الجدول', id); } catch(e){ failMsg(e); } }
});

/* ---------- subscriptions ---------- */
function v8Subs(db){
  const docs = q => q.docs.map(d => Object.assign({id:d.id}, d.data())), warn = k => e => console.warn(k, e && e.code);
  const merge = (key, part) => q => { S['_'+key] = S['_'+key] || {}; S['_'+key][part] = docs(q); const m = {}; Object.values(S['_'+key]).flat().forEach(x => m[x.id] = x); S[key] = Object.values(m).sort((a,b) => a.at < b.at ? 1 : -1); render(); };
  ['extras','tbreqs'].forEach(col => {
    if(S.admin) db.collection(col).onSnapshot(merge(col,'all'), warn(col));
    else { db.collection(col).where('uid','==',S.uid).onSnapshot(merge(col,'mine'), warn(col)); if(S.sup && S.mySector) db.collection(col).where('sector','==',S.mySector).onSnapshot(merge(col,'sec'), warn(col)); }
  });
  const from = prevYm(prevYm(today().slice(0,7)));
  db.collection('rchanges').where('month','>=',from).onSnapshot(q => { S.rchanges = docs(q); refreshRosters(); render(); }, warn('rchanges'));
}
function v8Pending(){ return S.tbreqs.filter(x => x.status==='pending' && canDecideReq(x)).length + S.extras.filter(x => x.status==='pending' && canDecideReq(x)).length; }

/* ===================== v9: email-based auto link & full profile ===================== */
async function v9Self(db){
  let me = S.users[S.uid] || {}; try { const ud = await db.doc('users/'+S.uid).get(); if(ud.exists) me = ud.data(); } catch(e){}
  const em = ((S.user && S.user.email) || me.email || '').toLowerCase(); let emp = me.empNo || '';
  try {
    if(!me.empNo && em){
      const q = await db.collection('staff').where('email','==',em).limit(1).get();
      if(!q.empty){ const d = q.docs[0], st = d.data();
        if(!st.uid){ const now = new Date().toISOString(), bt = db.batch();
          bt.update(db.doc('staff/'+d.id), {uid:S.uid, linkedAt:now, linkMode:'email'});
          bt.update(db.doc('users/'+S.uid), {empNo:d.id, sector:st.sector||'', officialName:st.name, linkedAt:now});
          await bt.commit(); emp = d.id; try { await db.doc('linkreqs/'+S.uid).delete(); } catch(e){}
          audit('ربط تلقائي بالبريد الإلكتروني', `${st.name} · ${d.id}`); toast('تم ربط حسابك برقمك الوظيفي تلقائيًا'); } }
    }
  } catch(e){ console.warn('emailLink', e && e.code); }
  if(emp){ try { const a = await db.doc('staff/'+emp).get(); S.myStaff = a.exists ? a.data() : null; const p = await db.doc('staffpriv/'+emp).get(); S.myPriv = p.exists ? p.data() : null; render(); } catch(e){ console.warn('mypriv', e && e.code); } }
}
/* ---------- boot ---------- */
function startData(){
  const db = S.db;
  const h = (location.hash||'').slice(1); if(navList().some(([k]) => k===h) || PARENT[h]) S.view = h;
  const err = e => { console.error(e); if(e.code==='permission-denied'){ S.noDb = 'انتهت صلاحية دخولك أو تم إيقاف حسابك. أعد تحميل الصفحة.'; render(); } };
  const soft = key => e => { console.warn(key, e && e.code); if(e && e.code==='permission-denied'){ S[key] = []; render(); } else err(e); };
  const list = (path, field, n, key) => db.collection(path).orderBy(field,'desc').limit(n).onSnapshot(q => { S[key] = q.docs.map(d => Object.assign({id:d.id}, d.data())); render(); }, soft(key));
  db.doc('config/main').onSnapshot(s => { S.config = s.exists ? s.data() : null; S.configLoaded = true; S.ready = true; if(S.ui.adminTab!=='lists') S.ui.cfgInit = false; render(); }, err);
  db.collection('users').onSnapshot(q => { const u = {}; q.docs.forEach(d => u[d.id] = d.data()); S.users = u;
    const me = u[S.uid]; if(me){ S.myName = me.officialName || me.name; const wasAdmin = S.admin; S.admin = me.role==='admin'; if(me.active===false || (me.role==='maintenance') !== S.maint || (me.role==='supervisor') !== S.sup || (S.sup && (me.sector||'') !== S.mySector)){ location.reload(); return; } S.mySector = me.sector || ''; if(S.admin && !wasAdmin) location.reload(); }
    render(); }, err);
  if(S.maint){ list('reports','at',300,'reports'); db.collection('mchecks').where('by','==',S.uid).onSnapshot(q => { S.mchecks = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a,b) => a.at < b.at ? 1 : -1); render(); }, err); watchNewReports(); return; }
  if(S.admin) list('mchecks','at',300,'mchecks');
  db.doc('config/sched').onSnapshot(sn => { S.schedCfg = sn.exists ? sn.data() : null; subSched(); render(); }, e => console.warn('sched', e && e.code));
  db.collection('rosters').orderBy('month','desc').limit(3).onSnapshot(q => { S.rostersRaw = q.docs.map(d => Object.assign({id:d.id}, d.data())); refreshRosters(); render(); }, e => console.warn('rosters', e && e.code));
  subSched();
  list('schedules','publishedAt',12,'schedules');
  list('announcements','at',30,'anns');
  list('inspections','at',150,'insp');
  list('reports','at',120,'reports');
  list('swaps','at',150,'swaps');
  list('pathways','at',300,'pathways');
  list('rosc','at',500,'rosc');
  list('checkouts','at',300,'checkouts');
  if(S.admin) list('records','at',1000,'records');
  if(S.admin){ list('audit','at',100,'audit'); db.collection('allowed').onSnapshot(q => { S.allowed = q.docs.map(d => d.id); render(); }, err); }
  db.collection('acks').onSnapshot(q => { const a = {}; q.docs.forEach(d => a[d.id] = d.data()); S.acks = a; render(); }, err);
  v7Subs(db); v8Subs(db);
}
function init(){
  if(LANG === 'en'){ const app = document.getElementById('app'); app.dir = 'ltr'; app.lang = 'en'; document.documentElement.dir = 'ltr'; document.documentElement.lang = 'en'; document.title = 'Al Hayat EMS'; }
  tick(); setInterval(tick, 30000); hookXlsx();
  if(!window.firebase || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==='PASTE_HERE'){ S.noDb = window.firebase ? true : 'تعذّر تحميل مكتبات Firebase. تأكد من الاتصال بالإنترنت.'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  S.db = firebase.firestore();
  try { S.db.enablePersistence({synchronizeTabs:true}).catch(() => {}); } catch(e){}
  S.gate = 'loading'; render();
  firebase.auth().onAuthStateChanged(u => {
    S.authUser = u;
    if(!u){ S.uid = null; S.gate = 'login'; render(); return; }
    enterApp(u);
  });
}
init();
</script>
